<!DOCTYPE html>
<html lang="fa">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cargo Sort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Vazirmatn:wght@500;800&display=swap">
<style>
/* VOICE: bright, chunky, toy-like mobile puzzle game.
   IDEA: a harbor toy box; every control is a glossy candy button you press down.
   PICTURE: home screen with logo, level path and big Play button; the board in play.
   COLOUR and TYPE: theme night-blue ground, yellow/green/blue/purple candy buttons; Lilita One + Nunito/Vazirmatn.
   LAYOUT: one phone screen; top bar (home, level, coins, gear), home or board in the middle, boosters at the bottom. */
:root {
  --bg: #1f3048;
  --tbg: #273a55;
  --ink: #f4f7fb;
  --muted: #9fb3cc;
  --panel: #1b2b40;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gold: #ffcc33;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box; gap: 10px;
}
.ic { width: 24px; height: 24px; fill: currentColor; display: block; pointer-events: none; }

/* ---- Candy buttons ---- */
button {
  --c1: #ffd45e; --c2: #ffa91f; --edge: #b5640a;
  position: relative; isolation: isolate; font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: .3px;
  color: #fff; border: 0; border-radius: 16px; padding: 12px 16px; cursor: pointer;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), 0 5px 0 var(--edge), 0 8px 12px rgba(0,0,0,.3);
  text-shadow: 0 2px 0 var(--edge), 1.5px 0 0 var(--edge), -1.5px 0 0 var(--edge), 0 -1.5px 0 var(--edge);
  transition: transform .08s, box-shadow .08s; -webkit-tap-highlight-color: transparent;
}
button::before {
  content: ""; position: absolute; left: 5px; right: 5px; top: 3px; height: 44%; z-index: -1; pointer-events: none;
  border-radius: 12px 12px 50% 50% / 12px 12px 8px 8px; background: linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,.08));
}
button:active { transform: translateY(4px); box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), 0 1px 0 var(--edge), 0 3px 6px rgba(0,0,0,.25); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
button.green, button.ad { --c1: #86e874; --c2: #35b84a; --edge: #1d7a31; }
button.blue { --c1: #74c8ff; --c2: #2f86e8; --edge: #1b56a3; }
button.purple { --c1: #c891ff; --c2: #8b4fe0; --edge: #5a2aa3; }
button.red { --c1: #ff8f80; --c2: #e8473a; --edge: #9c2318; }
button.quiet { --c1: #a9bbd2; --c2: #6f86a3; --edge: #465a73; }
button.small { font-size: 15px; padding: 9px 12px; border-radius: 12px; }
button small { display: block; font-family: var(--body); font-weight: 800; font-size: 11px; letter-spacing: .5px; text-shadow: none; color: rgba(255,255,255,.92); margin-top: 2px; }
button.sq { width: 48px; height: 48px; padding: 0; display: grid; place-items: center; border-radius: 14px; }
button.sq .ic { width: 26px; height: 26px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }

/* ---- Top bar ---- */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 56px; }
.top .l { justify-self: start; }
.top .r { justify-self: end; display: flex; gap: 10px; align-items: center; }
.title { text-align: center; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.35); white-space: nowrap; }
.title p { margin: 5px 0 0; color: var(--muted); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.coinpill { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.35); border-radius: 999px; padding: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,.35); }
.coinpill b { font-family: var(--display); font-weight: 400; font-size: 18px; min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; transition: transform .1s; }
.coinpill b.bump { transform: scale(1.3); }
.coinpill button { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--edge); }
.coinpill button .ic { width: 18px; height: 18px; }
.coin { width: 24px; height: 24px; border-radius: 50%; flex: none; display: inline-block; vertical-align: middle;
  background: radial-gradient(circle at 35% 30%, #fff6b0, #ffcc33 45%, #d99a00); box-shadow: inset 0 0 0 2px #b97f00, inset 0 0 0 5px #ffd95a; }
.coin.big { width: 38px; height: 38px; }

/* ---- Board and boosters ---- */
.board { flex: 1; min-height: 0; position: relative; border-radius: 20px; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tip { position: absolute; left: 12px; right: 12px; top: 6px; background: #fff4d6; color: #1b1b1b; padding: 10px 14px; border-radius: 14px; font-weight: 800; font-size: 14px; text-align: center; white-space: pre-line; pointer-events: none; }
.bar { display: flex; justify-content: center; gap: 22px; padding: 10px 0 2px; }
.bwrap { display: grid; justify-items: center; gap: 9px; }
.boost { width: 70px; height: 62px; padding: 0; display: grid; place-items: center; border-radius: 20px; }
.boost .ic { width: 34px; height: 34px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.bname { font-family: var(--display); font-size: 14px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.badge { position: absolute; top: -9px; inset-inline-end: -10px; min-width: 26px; height: 26px; padding: 0 7px; box-sizing: border-box; border-radius: 13px;
  background: #e8473a; color: #fff; font-family: var(--body); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 3px;
  box-shadow: 0 0 0 2.5px #fff, 0 2px 4px rgba(0,0,0,.3); text-shadow: none; }
.badge.price { background: #2a3a52; }
.badge.price .coin { width: 14px; height: 14px; box-shadow: inset 0 0 0 1.5px #b97f00; }
.badge.ad { background: #35b84a; }
.badge .ic { width: 13px; height: 13px; }

/* ---- Home ---- */
.home { flex: 1; min-height: 0; position: relative; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 12px 18px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tbg) 62%, #9fd4ff) 0%, var(--tbg) 52%, color-mix(in srgb, var(--tbg) 70%, #000) 100%); }
.logo { font-family: "Lilita One", "Arial Rounded MT Bold", sans-serif; line-height: .86; text-align: center; transform: rotate(-3deg); margin-top: 4px; direction: ltr; }
.logo span { display: block; font-size: clamp(44px, 14vw, 66px); color: #ffcc33; text-shadow: 0 3px 0 #c46d00, 0 6px 0 #8a4a00, 0 12px 14px rgba(0,0,0,.35); }
.logo span + span { color: #fff; font-size: clamp(38px, 12vw, 56px); text-shadow: 0 3px 0 #2f86e8, 0 6px 0 #1b56a3, 0 12px 14px rgba(0,0,0,.35); }
.path { flex: 1; min-height: 120px; width: 100%; max-width: 300px; }
.path svg { width: 100%; height: 100%; display: block; overflow: visible; }
.path text { font-family: var(--display); }
.side { position: absolute; top: 46%; display: grid; justify-items: center; gap: 8px; }
.side.s1 { inset-inline-start: 12px; } .side.s2 { inset-inline-end: 12px; }
.side button { width: 62px; height: 62px; padding: 0; display: grid; place-items: center; border-radius: 18px; }
.side button .ic { width: 32px; height: 32px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.side .dot { position: absolute; top: -5px; inset-inline-end: -5px; width: 16px; height: 16px; border-radius: 50%; background: #e8473a; box-shadow: 0 0 0 2.5px #fff; }
.play { width: min(310px, 100%); font-size: 32px; padding: 16px 18px 14px; border-radius: 22px; animation: breathe 1.6s ease-in-out infinite; }
.play small { font-size: 13px; }
@keyframes breathe { 50% { transform: scale(1.04); } }

/* ---- Popups and screens ---- */
.overlay {
  position: fixed; inset: 0; background: rgba(5,10,18,.66); display: grid; place-items: center; z-index: 6;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.card { position: relative; background: linear-gradient(#2e4868, var(--panel)); border-radius: 24px; padding: 28px 20px 22px; width: min(360px, 100%); box-sizing: border-box;
  display: grid; gap: 14px; text-align: center; box-shadow: 0 0 0 4px rgba(255,255,255,.1), 0 10px 0 rgba(0,0,0,.35); }
.card h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 32px; text-wrap: balance; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.card p { margin: 0 0 4px; color: var(--muted); font-weight: 700; }
.reward { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); font-size: 38px; color: var(--gold) !important; margin: 0 0 4px; text-shadow: 0 3px 0 #8a4a00; }
.hint { font-size: 13px; }
button.x { position: absolute; top: -14px; inset-inline-end: -10px; width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
button.x .ic { width: 22px; height: 22px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.06); font-weight: 800; font-size: 16px; text-align: start; }
button.switch { width: 66px; height: 36px; padding: 0; border-radius: 18px; flex: none; --c1: #6b7c93; --c2: #4c5b70; --edge: #2b3646; }
button.switch::after { content: ""; position: absolute; top: 4px; inset-inline-start: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.25); transition: inset-inline-start .15s; }
button.switch[aria-checked="true"] { --c1: #86e874; --c2: #35b84a; --edge: #1d7a31; }
button.switch[aria-checked="true"]::after { inset-inline-start: 34px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; background: linear-gradient(#24395a, #15233a); }
.screen header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top, 0px)) 16px 8px; max-width: 560px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.screen header > :last-child { justify-self: end; }
.screen header h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.screen .body { flex: 1; overflow-y: auto; padding: 8px 16px 28px; display: grid; gap: 12px; align-content: start; max-width: 560px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.sect { font-family: var(--display); font-size: 21px; margin: 10px 4px 0; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.offer { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 18px;
  background: linear-gradient(#33507a, #26405f); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 5px 0 rgba(0,0,0,.3); text-align: start; }
.offer .art { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; position: relative; overflow: hidden; }
.offer .art .ic { width: 32px; height: 32px; color: #fff; }
.offer .art i { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 14px; border-radius: 4px; }
.offer b { font-family: var(--display); font-weight: 400; font-size: 19px; display: block; }
.offer span { color: var(--muted); font-size: 13px; font-weight: 700; }
.offer button { min-width: 104px; }
.fakead { font-family: var(--display); font-size: 26px; text-align: center; color: var(--ink); }
.fakead span { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); margin-top: 6px; }
.flycoin { position: fixed; width: 20px; height: 20px; border-radius: 50%; z-index: 8; pointer-events: none; transition: transform .6s cubic-bezier(.5,-0.3,.6,1), opacity .6s;
  background: radial-gradient(circle at 35% 30%, #fff6b0, #ffcc33 45%, #d99a00); box-shadow: inset 0 0 0 2px #b97f00; }
.toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: var(--panel); padding: 12px 18px; border-radius: 14px; font-weight: 800; z-index: 9; max-width: calc(100% - 48px); text-align: center; box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
:root[lang="fa"] { --display: "Vazirmatn", system-ui, sans-serif; --body: "Vazirmatn", system-ui, sans-serif; }
:root[lang="fa"] button, :root[lang="fa"] .bname { font-weight: 800; }
:root[lang="fa"] .title h1 { font-weight: 800; font-size: 23px; }
:root[lang="fa"] .card h2, :root[lang="fa"] .screen header h2 { font-weight: 800; font-size: 27px; }
:root[lang="fa"] .offer b, :root[lang="fa"] .sect { font-weight: 800; }
/* ---- Step 2: boosters, streak, shop ---- */
.bar { gap: 10px; }
.boost { width: 58px; height: 54px; border-radius: 17px; }
.boost .ic { width: 30px; height: 30px; }
.boost.on { --c1: #fff2a8; --c2: #ffcc33; --edge: #b5640a; animation: breathe .9s ease-in-out infinite; }
.bname { font-size: 13px; }
.tool { background: #ffcc33; color: #3a2400; font-weight: 800; text-align: center; padding: 8px 12px; border-radius: 14px; margin-top: -4px; }
.side { display: grid; gap: 18px; top: 38%; }
.sbtn { position: relative; display: grid; justify-items: center; gap: 8px; }
.timer { background: rgba(0,0,0,.45); border-radius: 8px; padding: 1px 6px; font-family: var(--body); font-weight: 800; font-size: 12px; font-variant-numeric: tabular-nums; }
.streak { display: flex; align-items: center; gap: 2px; background: linear-gradient(#ff9a3c, #e8473a); color: #fff; border-radius: 999px; padding: 3px 10px 3px 6px; font-family: var(--display); font-size: 18px; box-shadow: 0 3px 0 #9c2318; margin-bottom: -4px; z-index: 1; }
.streak .ic { width: 20px; height: 20px; }
.winrow { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.08); border-radius: 999px; padding: 5px 12px 5px 8px; font-weight: 800; font-size: 14px; color: #ffb27a; }
.chip.pig { color: #ffb3d1; }
.chip .ic { width: 18px; height: 18px; }
.warn { color: #ff8f80 !important; font-weight: 800 !important; }
.items { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.item { width: 74px; display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 16px; background: rgba(255,255,255,.07); font-family: var(--display); font-size: 18px; }
.item .ic, .item .coin { width: 34px; height: 34px; }
.ibg { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.ibg .ic { width: 28px; height: 28px; color: #fff; }
.hero { position: relative; border-radius: 22px; padding: 16px; display: grid; gap: 12px; text-align: center;
  background: linear-gradient(160deg, #ff7a59, #c9306b 60%, #7a2a8c); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 6px 0 rgba(0,0,0,.3); }
.hero h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
.hero .items { gap: 6px; flex-wrap: nowrap; }
.hero .items .item { background: rgba(0,0,0,.2); width: auto; flex: 1 1 0; min-width: 0; max-width: 72px; font-size: 16px; }
.hero .items .item .ic, .hero .items .item .coin { width: 28px; height: 28px; }
.tag { position: absolute; top: -10px; inset-inline-end: 12px; background: #ffe066; color: #7a3a00; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 10px; box-shadow: 0 3px 0 #b5640a; }
.old { text-decoration: line-through; opacity: .7; font-size: 14px; margin-inline-end: 6px; font-family: var(--body); }
.piggy { background: linear-gradient(160deg, #ff9ec7, #d0557f); }
/* Rush Week */
.rushhead { border-radius: 22px; padding: 14px 16px; display: grid; gap: 8px; text-align: center; background: linear-gradient(160deg, #ffb13b, #f06a2b 55%, #c9306b); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 6px 0 rgba(0,0,0,.3); }
.rushhead b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.rushhead span { font-weight: 800; font-size: 13px; }
.track { display: grid; gap: 8px; }
.ms { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 16px; background: #2b4669; }
.ms .need { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 17px; background: rgba(0,0,0,.3); }
.ms.got .need { background: #35b84a; }
.ms .items { justify-content: flex-start; gap: 6px; flex-wrap: nowrap; }
.ms .item { width: 52px; padding: 6px 2px 4px; font-size: 14px; background: rgba(0,0,0,.18); }
.ms .item .ic, .ms .item .coin { width: 24px; height: 24px; } .ms .ibg { width: 30px; height: 30px; border-radius: 9px; } .ms .ibg .ic { width: 20px; height: 20px; }
.ms.done { opacity: .55; }
.board-list { display: grid; gap: 4px; }
.lrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 12px; border-radius: 12px; background: rgba(255,255,255,.05); font-weight: 800; }
.lrow .rk { font-family: var(--display); font-size: 18px; text-align: center; color: var(--muted); }
.lrow.top .rk { color: #ffcc33; }
.lrow.me { background: linear-gradient(90deg, #3e8ef7, #2f6fd6); box-shadow: 0 3px 0 #1b4a96; }
.lrow.me .rk { color: #fff; }
.lrow .pts { font-family: var(--display); font-size: 18px; }
.note { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; margin: 0; }
/* World Tour */
.citybar { width: min(330px, 100%); display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 18px; text-align: start;
  --c1: #3a5b88; --c2: #2b4669; --edge: #1a2c45; font-family: var(--body); text-shadow: none; position: relative; }
.citybar .sky { width: 92px; height: 56px; border-radius: 12px; overflow: hidden; }
.citybar .sky svg, .citycard .sky svg, .stamp svg, .lm svg { width: 100%; height: 100%; display: block; }
.citybar b { font-family: var(--display); font-weight: 400; font-size: 20px; display: block; line-height: 1.1; }
.citybar .meter { height: 10px; margin-top: 5px; }
.starchip { display: inline-flex; align-items: center; gap: 3px; background: rgba(0,0,0,.3); border-radius: 999px; padding: 3px 9px 3px 5px; font-family: var(--display); font-size: 17px; color: #ffe066; }
.starchip .ic, .starpill .ic { width: 20px; height: 20px; color: #ffcc33; }
.starpill { padding: 4px 12px 4px 8px; }
.citybar .dot { position: absolute; top: -5px; inset-inline-end: -5px; width: 16px; height: 16px; border-radius: 50%; background: #e8473a; box-shadow: 0 0 0 2.5px #fff; }
.citycard { border-radius: 22px; background: #26405f; box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 6px 0 rgba(0,0,0,.3); }
.citycard .sky { aspect-ratio: 100 / 60; border-radius: 22px 22px 0 0; overflow: hidden; }
.citycard .info { display: grid; gap: 6px; padding: 10px 14px 14px; }
.citycard .info div:first-child { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.citycard b { font-family: var(--display); font-weight: 400; font-size: 26px; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.citycard span { color: var(--muted); font-weight: 800; font-size: 13px; }
.offer .art.lm { background: none; }
.offer.built { opacity: .75; }
button.mk { display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; min-width: 74px; }
button.mk .ic { width: 18px; height: 18px; flex: none; }
.stamps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stamp { position: relative; display: grid; gap: 4px; justify-items: center; font-size: 12px; font-weight: 800; color: var(--muted); }
.stamp .sky { width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.stamp.locked .sky { filter: grayscale(1) brightness(.45); }
.stamp.now .sky { outline: 3px solid #ffcc33; outline-offset: 2px; }
.stamp .badge { position: absolute; top: -6px; inset-inline-end: -4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #35b84a; box-shadow: 0 0 0 2px #fff; }
.stamp .badge .ic { width: 15px; height: 15px; color: #fff; }
.stamp.locked .badge { background: #6f86a3; }
.chip.stars { color: #ffe066; }
.meter { height: 16px; border-radius: 8px; background: rgba(0,0,0,.3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(#ffe27a, #f2a900); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pack { position: relative; display: grid; justify-items: center; gap: 6px; padding: 16px 10px 12px; border-radius: 18px; background: linear-gradient(#33507a, #26405f); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 5px 0 rgba(0,0,0,.3); }
.pack .pile { height: 46px; display: flex; align-items: flex-end; justify-content: center; }
.pack .pile .coin { width: 28px; height: 28px; margin: 0 -6px; }
.pack b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 #8a4a00; }
.pack button { width: 100%; }
.pack .tag { inset-inline-end: 50%; transform: translateX(50%); white-space: nowrap; }
:root[dir="rtl"] .pack .tag { transform: translateX(-50%); }
.skin canvas { width: 56px; height: 56px; display: block; }
.offer.wide { grid-template-columns: 88px minmax(0, 1fr) auto; }
.offer.wide .art { width: 88px; } .offer.wide canvas { width: 88px; }
.card.starter { padding-top: 34px; background: linear-gradient(160deg, #ff7a59, #c9306b 60%, #7a2a8c); }
.ribbon { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: linear-gradient(#ffe066, #f2a900); color: #7a3a00; font-family: var(--display); font-size: 22px; padding: 6px 22px; border-radius: 12px; box-shadow: 0 4px 0 #b5640a; white-space: nowrap; }
.dev { display: grid; gap: 10px; padding: 12px; border-radius: 16px; border: 2px dashed rgba(255,255,255,.25); text-align: start; }
.dev label { font-weight: 800; font-size: 14px; color: var(--muted); }
.devrow { display: flex; gap: 8px; flex-wrap: wrap; }
.devrow input { flex: 1; min-width: 0; font: 800 16px var(--body); padding: 10px 12px; border-radius: 12px; border: 0; background: #0f1a2a; color: #fff; }
.devrow input:focus-visible { outline: 3px solid #fff; }
.devrow button { flex: 1; padding-inline: 6px; }
@media (max-width: 380px) { .bar { gap: 14px; } .boost { width: 62px; height: 56px; } .side button { width: 54px; height: 54px; } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } button, button.switch::after { transition: none; } }

/* ===== Saga skin (preview): a scenic level map with a bottom tab bar ===== */
.skinbar { position: fixed; z-index: 4; left: 8px; top: 6px; display: flex; background: rgba(0,0,0,.6); padding: 3px; border-radius: 999px; }
.skinbar a { cursor: pointer; white-space: nowrap; font: 800 10px var(--body); color: #fff; padding: 5px 9px; border-radius: 999px; opacity: .8; }
.skinbar a.on { background: #fff; color: #111; opacity: 1; }

/* top bar */

  --c1: #ffe86a; --c2: #ff9a1f; --edge: #a8510a; animation: breathe 1.6s ease-in-out infinite; }

/* bottom tab bar */
body[data-skin="saga"] .home::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 96px; z-index: 1; border-radius: 28px 28px 0 0;
  background: linear-gradient(180deg, #7d46d6, #4a2396 60%, #3a1a78); border-top: 4px solid #b793ff; box-shadow: 0 -6px 16px rgba(30,10,90,.35), inset 0 3px 0 rgba(255,255,255,.18); }

<script>
// ===== Core rules (same as Assets/Scripts/Core in the Unity project) =====
const EMPTY = -1;

// Conveyor belt levels: level 15, then every 3rd level. The belt replaces the dock and has 2 more spots.
const isBelt = level => level >= BELT_FROM && level % 3 === 0;
// Taped crates: from level 28, two crates in a stack taped together move as a pair.
const TAPE_FROM = 28;
// Big trucks (4 crates) from level 36; two-color trucks (2 + 2) from level 40.
const BIG_FROM = 36, TWO_FROM = 40, BIG_CAP = 4;

const LOCK_FROM = 48, LOCK_COLORS = ["#ffc83a", "#d5dce5", "#e08a4a"];

// Each countdown = the tap on which the solver moves that crate + BOMB_SLACK, so every level stays winnable.
const BOMB_FROM = 56, BOMB_SLACK = 8, BOMB_MARK = 100000;
// Cover tarp from level 64: a whole column is covered (can't be tapped) until the column next to it is empty.
const TARP_FROM = 64;
// A truck: color (first color), color2 (-1 = one color), need1 = spots for the first color.
function makeTruck(color, capacity, color2 = -1) { return { color, color2, capacity, need1: color2 >= 0 ? capacity / 2 : capacity, loaded: 0, loaded1: 0, loaded2: 0 }; }
const accepts = (t, c) => !!t && ((c === t.color && t.loaded1 < t.need1) || (c === t.color2 && t.loaded2 < t.capacity - t.need1));
// Loads one crate and returns the spot it goes to (first-color spots come first).
function loadTruck(t, c) { t.loaded++; if (c === t.color && t.loaded1 < t.need1) return t.loaded1++; return t.need1 + t.loaded2++; }
const BELT_EXTRA = 2;
const isHard = level => level >= 5 && level % 5 === 0;
function difficulty(level) {

  if (level === 2) return { ...d, colors: 3, trucks: 6, columns: 4, buffer: 5 };

  if (level >= TAPE_FROM) d.tapedPairs = Math.min(1 + Math.floor((level - TAPE_FROM) / 8), 3);
  if (level >= BIG_FROM) d.bigTrucks = Math.min(1 + Math.floor((level - BIG_FROM) / 10), 3);
  if (level >= TWO_FROM) d.twoColorTrucks = Math.min(1 + Math.floor((level - TWO_FROM) / 10), 3);
  if (level >= LOCK_FROM) d.locks = Math.min(1 + Math.floor((level - LOCK_FROM) / 10), 3);

function build(level, d, r) {
  const data = { level, capacity: d.capacity, buffer: d.buffer, bays: d.bays, columns: [], trucks: [] };
  for (let i = 0; i < d.trucks; i++) data.trucks.push(i % d.colors);

    const c = Math.floor(r() * cols);

  data.hidden = data.columns.map(col => col.map((_, row) => !!d.hiddenPct && row < col.length - 1 && Math.floor(r() * 100) < d.hiddenPct));
  data.frozen = data.columns.map(() => 0);

  data.taped = data.columns.map(col => col.map(() => false));

    const c = Math.floor(r() * cols), col = data.columns[c]; if (col.length < 3) continue;
    const row = Math.floor(r() * (col.length - 1)), tp = data.taped[c];

    tp[row] = true; data.hidden[c][row] = false; data.hidden[c][row + 1] = false; k++;
  }

  data.locks = data.columns.map(col => col.map(() => 0)); data.keys = data.columns.map(col => col.map(() => 0));
  const freeCell = (c, row) => !data.taped[c][row] && !(row > 0 && data.taped[c][row - 1]) && !data.locks[c][row] && !data.keys[c][row];
  for (let id = 1, tries = 0; id <= (d.locks || 0) && tries < 60; tries++) {
    const c1 = Math.floor(r() * cols), c2 = Math.floor(r() * cols); if (c1 === c2) continue;
    const l1 = data.columns[c1].length, l2 = data.columns[c2].length; if (l1 < 2 || !l2) continue;

  data.tarps = data.columns.map(() => -1);

}

// Builds several solvable layouts and keeps the one whose casual-player win rate is closest to the
// target for this level (a slowly falling sawtooth). If all are far too hard, the dock gets one more slot.
const CANDIDATES = 12, TOO_HARD = 0.2, MAX_EASING = 1;
function targetWinRate(level) {

// Daily challenge: same hard level for everyone that day (many colors and trucks, small dock), still solver-checked.
function generateChallenge(day) {

class Game {

      const spin = (to[0] > from[0] ? -1 : 1) * 0.35;
      const live = e.to === "buf" && game.belt; // belt spots keep moving during the flight
      await tween(0.17, k => { if (live) to = bufPos(e.ti); f.x = from[0] + (to[0] - from[0]) * k; f.y = from[1] + (to[1] - from[1]) * k + Math.sin(k * Math.PI) * arc; f.a = Math.sin(k * Math.PI) * spin; });
      flying = flying.filter(x => x !== f);
      if (e.to === "bay") {
        const tr = view.bays[e.ti]; loadTruck(tr, e.color); tr.last = e.slot; sfx.pop(tr.loaded - 1); puff(to[0], to[1] - 0.4, 4, "rgba(255,255,255,.5)", 0.5);
        squash = 1; tween(0.22, k => { squash = 1 - k; tr.bounce = -0.09 * Math.sin(k * Math.PI); });
      } else { view.buffer[e.ti] = e.color; sfx.thud(); buzz(12); puff(to[0], to[1] - 0.45, 5, "rgba(255,255,255,.4)", 0.7); }
    } else if (e.k === "depart") {
      const t = view.bays[e.bay], [bx, by] = bayPos(e.bay); sfx.horn(); buzz(25);
      puff(bx - 1.6, by - 0.6, 6, "rgba(200,200,200,.6)", 0.3);
      await tween(0.32, k => { const e2 = Math.pow(k, 1.6); t.off = e2 * 10; t.bounce = 0.05 * Math.sin(k * 9) * (1 - k); }); view.bays[e.bay] = null;
    } else if (e.k === "uncover") {
      const old = view.tarps.slice(); view.tarps = game.tarps.slice(); sfx.thud();
      old.forEach((n, c) => { if (n >= 0 && game.tarps[c] < 0) { view.lift = { c, n, k: 0 }; const [x, y] = colPos(c, 0); puff(x, y + 1, 8, "rgba(255,255,255,.55)", 0.8); } });
      await tween(0.35, k => view.lift && (view.lift.k = k)); view.lift = null;
    } else if (e.k === "arrive") {
      const t = { ...(e.truck || makeTruck(e.color, game.capacity)), loaded: 0, loaded1: 0, loaded2: 0, off: -9, bounce: 0 }; view.bays[e.bay] = t;
      await tween(0.3, k => t.off = -9 + 9 * k); tween(0.25, k => t.bounce = -0.08 * Math.sin(k * Math.PI) * (1 - k * 0.5));
    }
  }
  view = cloneView(game); busy = false; afterMove();
}

function loop() { beltTick(); draw(); requestAnimationFrame(loop); }

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();

    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

// ===== Rush Week (weekly event): points from wins, a reward track, and a group of 30 =====
// Weeks start on Saturday (2000-01-01 was a Saturday). Until a server is connected, the other 29 in the group are
// computer rivals, clearly labelled; their scores grow through the week toward a target fixed by the week's seed.
const RUSH_FROM = 10, RUSH_GROUP = 30;
const RUSH_TRACK = [
  [40, [["coins", 100]]],
  [100, [["undo", 2], ["slot", 1]]],
  [180, [["coins", 250]]],
  [280, [["crane", 2], ["magnet", 1]]],
  [400, [["coins", 600], ["crane", 2], ["magnet", 2], ["shuffle", 2]]],

const RUSH_PRIZES = [[1, 500], [2, 300], [3, 200], [10, 100]]; // [up to rank, coins]
const rushPrize = rank => { for (const [r, c] of RUSH_PRIZES) if (rank <= r) return c; return 0; };
const RIVALS = [["Sara","سارا"],["Ali","علی"],["Reza","رضا"],["Maryam","مریم"],["Amir","امیر"],["Neda","ندا"],["Hamid","حمید"],["Leila","لیلا"],["Omid","امید"],["Zahra","زهرا"],
  ["Kian","کیان"],["Nika","نیکا"],["Arash","آرش"],["Shirin","شیرین"],["Babak","بابک"],["Mina","مینا"],["Pouya","پویا"],["Yasaman","یاسمن"],["Dariush","داریوش"],["Elnaz","الناز"],
  ["Farhad","فرهاد"],["Golnar","گلنار"],["Hooman","هومن"],["Parisa","پریسا"],["Saman","سامان"],["Tara","تارا"],["Vahid","وحید"],["Roya","رویا"],["Navid","نوید"],["Bita","بیتا"]];

// Computer rivals for a week: names and target scores fixed by the week; score at fraction f of the week.
function rivals(w) {
  const r = rng(w * 7907 + 17), names = RIVALS.slice(); shuffle(names, r);

  rows.push({ name: t("you"), pts: myPts, me: true });

// Last week's prize, shown once on the home screen.

    city.marks.map(([type, color], i) => landmarkSVG(type, color, 52 + i * 85, HZ, 1.75, isBuilt(mask, i))).join("") +
    `<rect x="0" y="${HZ}" width="${W}" height="${H - HZ}" fill="url(#sg-gr)"/><rect x="0" y="${HZ}" width="${W}" height="5" fill="rgba(255,255,255,.35)"/>` +
    `<path d="${d}" fill="none" stroke="#9b5b2e" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#ffe3a6" stroke-width="24" stroke-linecap="round"/>` +
    `<path d="${d}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>`;
  for (let i = 0; i < n; i++) {
    const lvl = first + i, [x, y] = pos[i], done = lvl < cur, now = lvl === cur, hard = isHard(lvl), r = now ? 27 : 20;
    const fill = done ? "#3fcf55" : now ? (hard ? "#ff4d3d" : "#ffb21f") : hard ? "#b24a6a" : "#8f5be8";
    const edge = done ? "#1f7f35" : now ? (hard ? "#9c1c12" : "#b5560a") : hard ? "#5a1f35" : "#4a22a0";
    if (now) svg += `<circle cx="${x}" cy="${y}" r="${r + 10}" fill="rgba(255,255,255,.55)"><animate attributeName="r" values="${r + 7};${r + 13};${r + 7}" dur="1.6s" repeatCount="indefinite"/></circle>`;
    svg += `<circle cx="${x}" cy="${y + 4}" r="${r}" fill="${edge}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#fff" stroke-width="3"/>` +
      `<ellipse cx="${x}" cy="${y - r * .48}" rx="${r * .62}" ry="${r * .3}" fill="rgba(255,255,255,.4)"/>` +
      `<text x="${x}" y="${y + (now ? 9 : 7)}" text-anchor="middle" font-size="${now ? 26 : 19}" fill="#fff" stroke="${edge}" stroke-width="4" paint-order="stroke" style="font-family:var(--display)">${num(lvl)}</text>`;
    if (done) svg += `<g transform="translate(${x - 15} ${y + r - 2})" fill="#ffd23a" stroke="#b5760a" stroke-width="1"><use href="#i-star" width="10" height="10"/><use href="#i-star" x="10" y="2" width="10" height="10"/><use href="#i-star" x="20" width="10" height="10"/></g>`;
    if (now) svg += `<path d="M${x - 9} ${y - r - 26} h18 l-9 13z" fill="#fff" stroke="#b5560a" stroke-width="2.5" stroke-linejoin="round"><animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="1s" repeatCount="indefinite"/></path>`;
  }
  return svg + "</svg>";
}

function today() { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2000, 0, 1)) / 86400000); }
function checkDaily() {
  const last = store.get("dailyDay", 0); if (last === today()) return;
  const streak = last === today() - 1 ? Math.min(store.get("streak", 0) + 1, 7) : 1;
  store.set("streak", streak); pendingDaily = 20 * streak;
  $("dailyTitle").textContent = t("daily_title", streak); $("dailyReward").textContent = "+" + num(pendingDaily); $("daily").hidden = false;
}
function finishDaily(n) { store.set("dailyDay", today()); pendingDaily = 0; $("daily").hidden = true; addCoins(n); maybeStarter(); }

// ===== Game flow =====
function toast(msg, ms = 1600) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, ms); }
function refresh() {
  const hard = level > 0 && isHard(level);
  $("level").textContent = level > 0 ? t(hard ? "hard_level" : "level", level) : t("challenge_level");
  $("level").style.color = hard ? "#ff6b5e" : ""; $("level").style.fontSize = hard ? "22px" : "";
  $("trucks").textContent = t("trucks", game.shipped, game.queue.length);
  renderBar();
  $("coins").textContent = num(coins);
}
function start(n) {
  const data = n > 0 ? generate(n) : generateChallenge(today());
  if (n > 0 && isBelt(n)) data.belt = true, data.buffer += BELT_EXTRA;
  level = n; game = new Game(data); game.slotPicker = nearestBeltSlot; history = []; bonus = 0; hintCol = -1; busy = false; flying = []; setCrane(false, true);
  // Free boosters for this level: one undo, plus win-streak rewards (3+ wins: Crane, 5+ wins: Magnet too).
  free = { undo: 1, slot: 0, crane: n > 0 && wstreak >= 3 ? 1 : 0, magnet: n > 0 && wstreak >= 5 ? 1 : 0, shuffle: 0 };
  view = cloneView(game); $("win").hidden = true; $("lose").hidden = true; pendingWin = 0; refresh();
  // Intro: trucks drive in, crates pop up.
  view.bays.forEach(tr => tr && (tr.off = -9)); introK = 0; busy = true;
  tween(0.45, k => { introK = k; view.bays.forEach(tr => tr && (tr.off = -9 + 9 * k)); }).then(() => { introK = 1; busy = false; });
  tutorialStep();
  if (screen !== "game") return;
  if (n === FROZEN_FROM) toast(t("twist_frozen"), 3000); else if (n === HIDDEN_FROM) toast(t("twist_hidden"), 3000);
  else if (n === BELT_FROM) toast(t("belt_intro"), 4200);
  else if (n === TAPE_FROM) toast(t("tape_intro"), 4200);
  else if (n === BIG_FROM) toast(t("big_intro"), 4200);
  else if (n === TWO_FROM) toast(t("two_intro"), 4200);
  else if (n === LOCK_FROM) toast(t("lock_intro"), 4200);
  else if (n === BOMB_FROM) toast(t("bomb_intro"), 4600);
  else if (n === TARP_FROM) toast(t("tarp_intro"), 4600);
  else if (free.crane) toast(t("streak_bonus", wstreak), 2400); else if (n > 0 && isHard(n)) toast(t("hard_start"));
}
function afterMove() {
  refresh(); tutorialStep();
  if (game.status === "won") {
    sfx.win(); burstConfetti(); if (level === 1) store.set("tutDone", true); tutorialStep();
    if (level === 0) { store.set("challengeDay", today()); pendingWin = CHALLENGE_REWARD; }
    else { store.set("level", level + 1); pendingWin = (10 + Math.floor(level / 2)) * (isHard(level) ? 2 : 1);
      wstreak++; store.set("wstreak", wstreak);
      const gotStars = winStars(level); store.set("stars", stars() + gotStars); $("winStars").lastChild.textContent = t("win_stars", gotStars);
      rushRollover(); const gotRush = level >= RUSH_FROM ? rushPointsForWin(game.queue.length, wstreak) : 0;
      if (gotRush) { store.set("rushPts", rushPts() + gotRush); rushSync(); } $("winRush").hidden = !gotRush; $("winRush").lastChild.textContent = t("rush_win", gotRush);
      const add = Math.min(PIGGY_MAX - piggy(), isHard(level) ? 40 : 20); store.set("piggy", piggy() + add);
      $("winPiggy").lastChild.textContent = t("piggy_add", add); $("winPiggy").hidden = add <= 0; $("winStreak").lastChild.textContent = t("win_streak", wstreak); }
    $("winStreak").hidden = $("winStars").hidden = level === 0; if (level === 0) $("winRush").hidden = true; if (level === 0) $("winPiggy").hidden = true;
    $("winTitle").textContent = level > 0 ? t("win_title", level) : t("challenge_win"); countUp($("winReward"), pendingWin);
    busy = true; setTimeout(() => { busy = false; $("win").hidden = false; }, 800);
  }
  else if (game.status === "lost") { sfx.lose(); setCrane(false); buzz(80);
    const boom = game.exploded; $("lose").querySelector("h2").textContent = t(boom ? "bomb_title" : "lose_title");
    $("lose").querySelector("p").textContent = t(boom ? "bomb_text" : "lose_text"); $("revive").firstElementChild.textContent = t(boom ? "bomb_revive" : "revive");
    $("streakWarn").hidden = level === 0 || wstreak < 2; $("streakWarn").textContent = t("streak_warn", wstreak); $("lose").hidden = false; }
}
function fakeAd(label, done) {
  $("adText").firstChild.textContent = label; $("adText").lastChild.textContent = t("test_ad"); $("ad").hidden = false;
  setTimeout(() => { $("ad").hidden = true; done(); }, 1000);
}
function rewarded(done) { if (busy) return; fakeAd(t("rewarded_ad"), done); }

cv.addEventListener("pointerdown", ev => {
  if (busy || game.status !== "playing") return;
  const r = cv.getBoundingClientRect(); const px = (ev.clientX - r.left) * dpr, py = (ev.clientY - r.top) * dpr;
  const wx = (px - cx) / scale, wy = (cy - py) / scale;
  if (wy < BASEY - 0.8 || wy > (game.belt ? BELT.yc - BELT.r - 0.55 : BUFY - 0.7)) return;
  let c = -1; for (let i = 0; i < view.columns.length; i++) if (Math.abs(wx - colPos(i, 0)[0]) <= COLSP / 2) c = i;
  if (c < 0) return;
  if (craneMode) {
    const col = game.columns[c]; if (!col.length) return;
    const r0 = Math.max(0, Math.min(col.length - 1, Math.round((wy - BASEY) / ROWSP)));
    if (!game.canPluck(c, r0)) { sfx.invalid(); return; }
    pay("crane", () => { setCrane(false); history.push(game.clone()); sfx.horn(); play(game.pluck(c, r0)); });
    return;
  }
  if (!game.canTap(c)) { sfx.invalid(); if (game.frozen[c] > 0) toast(t("frozen")); else if (game.covered(c)) toast(t("covered")); if (game.columns[c].length) { view.shake = { c, t: 0 }; tween(0.25, k => view.shake && (view.shake.t = k * 0.25)).then(() => view.shake = null); } return; }
  const frozenBefore = game.frozen.filter(f => f > 0).length, hiddenBefore = game.columns.map((_, i) => game.columns[i].length > 1 && game.hidden[i][game.columns[i].length - 2]);
  history.push(game.clone()); const events = game.tap(c);
  if (game.frozen.filter(f => f > 0).length < frozenBefore) setTimeout(() => { sfx.thud(); sfx.pop(3); buzz(20); }, 150);
  if (hiddenBefore[c]) setTimeout(() => sfx.pop(5), 120);
  play(events);
});

function undo() {
  if (busy || !history.length || game.status === "won") return;
  const size = game.buffer.length; game = history.pop(); while (game.buffer.length < size) game.addSlot();
  view = cloneView(game); $("lose").hidden = true; hintCol = -1; refresh(); tutorialStep();
}
function spend(price) { if (coins < price) return false; coins -= price; store.set("coins", coins); sfx.coins(); refresh(); return true; }
// Paying for a booster: free uses first, then ones you own, then coins, then a rewarded ad.
function pay(k, done) {
  if (free[k] > 0) { free[k]--; refresh(); return done(); }
  if (inv[k] > 0) { inv[k]--; store.set("inv", inv); refresh(); return done(); }
  if (spend(BPRICE[k])) return done();
  rewarded(done);
}
function badgeHTML(k) {
  const n = (free[k] || 0) + (inv[k] || 0);
  if (n > 0) return `<span class="badge">${num(n)}</span>`;
  if (coins >= BPRICE[k]) return `<span class="badge price"><span class="coin"></span>${num(BPRICE[k])}</span>`;
  return '<span class="badge ad"><svg class="ic"><use href="#i-play"/></svg></span>';
}
function renderBar() {
  $("bar").innerHTML = BOOSTERS.map(k => `<div class="bwrap"><button class="boost ${BCLASS[k]}${craneMode && k === "crane" ? " on" : ""}" data-b="${k}" aria-label="${t(k)}">` +
    `<svg class="ic"><use href="#i-${k}"/></svg>${badgeHTML(k)}</button><span class="bname">${t(k)}</span></div>`).join("");
}
function setCrane(on, quiet) { craneMode = on; $("craneTip").hidden = !on; $("craneTip").textContent = t("crane_tip"); if (!quiet) renderBar(); }
function addSlot() { bonus++; game.addSlot(); view = cloneView(game); refresh(); }
const BOOST_ACT = {
  undo: () => { if (!history.length || game.status === "won") return; pay("undo", undo); },
  slot: () => { if (bonus >= 2) return toast(t("dock_max")); pay("slot", addSlot); },
  crane: () => { if (game.status !== "playing") return; setCrane(!craneMode); },
  magnet: () => {
    if (game.status !== "playing") return; if (!game.magnetTarget()) return toast(t("magnet_none"));
    pay("magnet", () => { history.push(game.clone()); sfx.horn(); play(game.magnet()); });
  },
  shuffle: () => {
    if (game.status !== "playing" && game.status !== "lost") return;
    pay("shuffle", () => {
      history.push(game.clone()); const lost = game.status === "lost"; game = game.shuffled(Date.now()); if (lost) $("lose").hidden = true;
      view = cloneView(game); view.columns.forEach((col, c) => col.length && puff(...colPos(c, col.length - 1), 6));
      sfx.thud(); sfx.pop(4); buzz(30); afterMove();
    });
  },
};
$("bar").onclick = ev => { const b = ev.target.closest("[data-b]"); if (!b || busy) return; if (b.dataset.b !== "crane") setCrane(false); BOOST_ACT[b.dataset.b](); };
$("loseUndo").onclick = () => pay("undo", undo);
$("revive").onclick = () => rewarded(() => {
  if (game.exploded) { game.extendBombs(5); view = cloneView(game); refresh(); } else addSlot();
  $("lose").hidden = true; });
function breakStreak() { if (level > 0 && wstreak) { wstreak = 0; store.set("wstreak", 0); } }
$("retry").onclick = () => { breakStreak(); start(level); };
function finishWin(n, allowAd) {
  addCoins(n); pendingWin = 0; $("win").hidden = true;
  if (level === 0) { start(Math.max(1, store.get("level", 1))); return setScreen("home"); }
  const next = level + 1;
  if (allowAd && !store.get("noads", false) && next >= 4 && (next - 4) % 3 === 0) fakeAd(t("between_ad"), () => start(next)); else start(next);
}
$("claim").onclick = () => { if (pendingWin) finishWin(pendingWin, true); };
$("claim3").onclick = () => { if (pendingWin) rewarded(() => finishWin(pendingWin * 3, false)); };
$("claimDaily").onclick = () => { if (pendingDaily) finishDaily(pendingDaily); };
$("claim2").onclick = () => { if (pendingDaily) rewarded(() => finishDaily(pendingDaily * 2)); };
const CHALLENGE_REWARD = 100;

// Home, shop and settings
function openShop() { renderShop(); $("shop").hidden = false; }
$("shopHome").onclick = openShop;
$("coinPlus").onclick = () => { if (!busy) openShop(); };
$("closeShop").onclick = () => $("shop").hidden = true;
$("rushHome").onclick = openRush;
$("closeRush").onclick = () => { $("rush").hidden = true; renderHome(); };
$("rushBody").onclick = ev => { const b = ev.target.closest("[data-claim]"); if (b) claimRush(+b.dataset.claim); };
$("tourHome").onclick = openTour; $("cityBar").onclick = openTour;
$("closeTour").onclick = () => { $("tour").hidden = true; renderHome(); };
$("tourBody").onclick = ev => { const b = ev.target.closest("[data-build]"); if (b) buildMark(+b.dataset.build); };
$("playBtn").onclick = () => {
  const cur = Math.max(1, store.get("level", 1));
  // Keep a level that is already being played; otherwise start it fresh.
  setScreen("game");
  if (!(level === cur && history.length && game.status === "playing")) start(cur);
};
$("challengeHome").onclick = () => {
  if (store.get("challengeDay", 0) === today()) return toast(t("challenge_done"));
  setScreen("game"); start(0); toast(t("challenge_start", CHALLENGE_REWARD));
};
function goHome() { if (!$("lose").hidden) breakStreak(); $("settings").hidden = true; $("lose").hidden = true; setCrane(false); if (game.status !== "playing" || level === 0) start(Math.max(1, store.get("level", 1))); setScreen("home"); }
$("homeBtn").onclick = () => { if (!busy) goHome(); };
$("homeBtn2").onclick = goHome;
$("gearBtn").onclick = () => { if (busy) return; renderSettings(); $("settings").hidden = false; };
$("closeSettings").onclick = () => $("settings").hidden = true;
$("settings").onclick = ev => { if (ev.target === $("settings")) $("settings").hidden = true; };
$("restartBtn").onclick = () => { $("settings").hidden = true; if (history.length) breakStreak(); start(level); };
$("restoreBtn").onclick = () => toast(t("restore_none"));
// Developer tools (test builds only): jump to any level, or add coins.
function devGo(n) {
  n = Math.max(1, Math.min(999, Math.floor(+n) || 1));
  $("lose").hidden = $("win").hidden = $("settings").hidden = true; pendingWin = 0;
  store.set("level", n); setScreen("game"); start(n); renderHome();
}
$("devForm").onsubmit = ev => { ev.preventDefault(); devGo($("devLevel").value); };
$("devForm").querySelectorAll("[data-lv]").forEach(b => b.onclick = () => devGo(b.dataset.lv));
$("devCoins").onclick = () => { $("settings").hidden = true; addCoins(1000); };
$("privacyBtn").onclick = () => toast(t("privacy_soon"));
$("soundBtn").onclick = () => { store.set("sound", !soundOn()); renderSettings(); };
$("vibeBtn").onclick = () => { store.set("vibe", !vibeOn()); buzz(40); renderSettings(); };
$("lang").onclick = () => {
  lang = fa() ? "en" : "fa"; store.set("lang", lang); applyLanguage(); tutorialStep();
  if (pendingDaily) { $("dailyTitle").textContent = t("daily_title", store.get("streak", 1)); $("dailyReward").textContent = "+" + num(pendingDaily); }
};

new ResizeObserver(resize).observe(boardEl); resize();
applyTheme();
start(Math.max(1, store.get("level", 1)));
applyLanguage();
checkDaily();
setScreen("home");
loop();
</script>
