<title>Cargo Sort</title>

<style>
/* Layout: one-screen phone game; HUD top, canvas board fills the middle, booster bar bottom. Single dark "night dock" look. */
:root {
  --bg: #1f3048;
  --ground: #2b4263;
  --slot: #172538;
  --ink: #f4f7fb;
  --muted: #9fb3cc;
  --btn: #ffb72b;
  --btn-ad: #5bd16a;
  --btn-ink: #1b1b1b;
  --panel: #13202f;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gold: #ffcc33;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; gap: 8px;
}
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.title { text-align: center; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: .5px; line-height: 1; }
.title p { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .4px; }
.top .right { justify-self: end; }
.board { flex: 1; min-height: 0; position: relative; border-radius: 18px; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
button {
  font-family: var(--body); font-weight: 800; font-size: 15px; border: 0; border-radius: 14px;
  padding: 12px 10px; background: var(--btn); color: var(--btn-ink); cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.28); transition: transform .08s;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button.ad { background: var(--btn-ad); }
button.small { font-size: 13px; padding: 8px 12px; }
button small { display: block; font-size: 11px; opacity: .7; font-weight: 800; letter-spacing: .5px; }
.overlay {
  position: fixed; inset: 0; background: rgba(5,10,18,.62); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
}
.card { background: var(--panel); border-radius: 22px; padding: 26px 22px; width: min(360px, 100%); box-sizing: border-box; display: grid; gap: 12px; text-align: center; }
.card h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 32px; text-wrap: balance; }
.card p { margin: 0 0 6px; color: var(--muted); }
.fakead { font-family: var(--display); font-size: 26px; text-align: center; color: var(--ink); }
.fakead span { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); margin-top: 6px; }
.board { position: relative; }
.tip { position: absolute; left: 12px; right: 12px; top: 6px; background: #fff4d6; color: #1b1b1b; padding: 10px 14px; border-radius: 14px; font-weight: 800; font-size: 14px; text-align: center; white-space: pre-line; pointer-events: none; }
.flycoin { position: fixed; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px rgba(0,0,0,.25); z-index: 7; pointer-events: none; transition: transform .6s cubic-bezier(.5,-0.3,.6,1), opacity .6s; }
.coins.bump { transform: scale(1.3); transition: transform .1s; }
.toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: var(--panel); padding: 12px 18px; border-radius: 12px; font-weight: 800; z-index: 6; max-width: calc(100% - 48px); text-align: center; }
:root[lang="fa"] { --display: "Vazirmatn", system-ui, sans-serif; --body: "Vazirmatn", system-ui, sans-serif; }
:root[lang="fa"] .title h1 { font-weight: 800; font-size: 26px; }
:root[lang="fa"] .card h2 { font-weight: 800; font-size: 27px; }
.coins { display: block; margin-top: 4px; text-align: center; color: var(--gold); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.reward { font-family: var(--display); font-size: 34px; color: var(--gold); margin: 0 0 4px; }
.card.shop { width: min(400px, 100%); max-height: calc(100% - 32px); overflow-y: auto; }
.themes { display: grid; gap: 8px; text-align: start; }
.theme { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 6px; border-radius: 14px; background: rgba(255,255,255,.04); }
.swatch { width: 44px; height: 44px; border-radius: 10px; position: relative; overflow: hidden; }
.swatch i { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 14px; border-radius: 4px; }
.theme b { font-weight: 800; }
.theme button { min-width: 108px; }
button.quiet { background: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.left { display: grid; gap: 6px; justify-items: start; }
#challengeBtn { font-size: 12px; padding-inline: 10px; }
.hint { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.right { display: grid; gap: 4px; justify-items: end; }
#portBtn.ready { background: var(--btn-ad); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }
.card.port { width: min(420px, 100%); max-height: calc(100% - 32px); overflow-y: auto; gap: 10px; }
.portmeta { display: flex; justify-content: space-between; font-weight: 800; color: var(--muted); }
.portmeta b { color: var(--gold); }
.scene { width: 100%; border-radius: 14px; display: block; }
.scene .pop { transform-box: fill-box; transform-origin: 50% 100%; animation: popin .45s ease-out; }
@keyframes popin { 0% { transform: scale(0); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.pieces { display: grid; gap: 6px; }
.piece { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 12px; background: rgba(255,255,255,.04); text-align: start; }
.piece button { min-width: 112px; }
@media (prefers-reduced-motion: reduce) { #portBtn.ready, .scene .pop { animation: none; } }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<script>
// ===== Core rules (same as Assets/Scripts/Core in the Unity project) =====
const EMPTY = -1;
const COLORS = ["#f04e4e","#3e8ef7","#4cc95b","#ffcc33","#a85cf0","#ff8a2b","#2fd6d6","#ff6fb5"];

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

const HIDDEN_FROM = 11, FROZEN_FROM = 21;
const isHard = level => level >= 5 && level % 5 === 0;
function difficulty(level) {
  const d = { bays: 2, capacity: 3, maxHeight: 8 };
  if (level <= 1) return { ...d, colors: 2, trucks: 4, columns: 3, buffer: 5 };
  if (level === 2) return { ...d, colors: 3, trucks: 6, columns: 4, buffer: 5 };
  d.colors = Math.min(3 + Math.floor((level - 1) / 3), 8);
  d.trucks = Math.min(d.colors * 2 + Math.floor((level - 1) / 2), 16);
  d.columns = Math.max(4, Math.min(d.colors, 7));
  d.buffer = level < 15 ? 5 : 4;
  if (level % 5 === 0) d.buffer -= 1;
  d.hard = isHard(level);
  if (level >= HIDDEN_FROM) d.hiddenPct = Math.min(20 + Math.floor((level - HIDDEN_FROM) / 2), 30);
  if (level >= FROZEN_FROM) { d.frozenCols = level >= 41 ? 2 : 1; d.frozenTaps = 3 + (level % 3); }
  return d;
}

function build(level, d, r) {
  const data = { level, capacity: d.capacity, buffer: d.buffer, bays: d.bays, columns: [], trucks: [] };
  for (let i = 0; i < d.trucks; i++) data.trucks.push(i % d.colors);
  shuffle(data.trucks, r);
  const crates = [];
  for (const c of data.trucks) for (let k = 0; k < d.capacity; k++) crates.push(c);
  shuffle(crates, r);
  const cols = Math.max(d.columns, Math.ceil(crates.length / d.maxHeight));
  for (let c = 0; c < cols; c++) data.columns.push([]);
  let i = 0;
  while (i < crates.length) {
    const c = Math.floor(r() * cols);
    const min = Math.min(...data.columns.map(x => x.length));
    if (data.columns[c].length > min + 1 || data.columns[c].length >= d.maxHeight) continue;
    data.columns[c].push(crates[i++]);
  }
  // Twists: hidden "?" crates and frozen columns (random numbers drawn after the layout).
  data.hidden = data.columns.map(col => col.map((_, row) => !!d.hiddenPct && row < col.length - 1 && Math.floor(r() * 100) < d.hiddenPct));
  data.frozen = data.columns.map(() => 0);
  for (let k = 0; k < (d.frozenCols || 0); k++) { const c = Math.floor(r() * cols); if (!data.frozen[c]) data.frozen[c] = d.frozenTaps + k * 2; }
  return data;
}

// Builds several solvable layouts and keeps the one whose casual-player win rate is closest to the
// target for this level (a slowly falling sawtooth). If all are far too hard, the dock gets one more slot.
const CANDIDATES = 12, TOO_HARD = 0.2, MAX_EASING = 1;
function targetWinRate(level) {
  if (level <= 0) return 0.3;
  if (level <= 3) return 0.95;
  const base = level <= 30 ? 0.9 - (level - 3) * (0.5 / 27) : Math.max(0.25, 0.4 - (level - 30) * 0.005);
  const wave = [-0.15, 0.12, 0.04, 0, -0.05];
  return Math.min(0.97, Math.max(0.12, base + wave[level % 5]));
}
function casualWinRate(data, seed, runs = 40) {
  const r = rng(seed ^ 0x5bd1e995), start = new Game(data); let wins = 0;
  for (let run = 0; run < runs; run++) {
    const s = start.clone(); let guard = 2000;
    while (s.status === "playing" && guard-- > 0) {
      const cols = [...s.columns.keys()];
      let choices = cols.filter(c => s.canTap(c) && s.bayFor(s.top(c)) >= 0);
      if (!choices.length && r() < 0.65) { const m = pickMove(s); if (m >= 0 && s.canTap(m)) { s.tap(m); continue; } }
      if (!choices.length) choices = cols.filter(c => s.canTap(c));
      if (!choices.length) break;
      s.tap(choices[Math.floor(r() * choices.length)]);
    }
    if (s.status === "won") wins++;
  }
  return wins / runs;
}
function generate(level, d = difficulty(level), seed = level * 7919) {
  let last = null, best = null, bestGap = Infinity, bestRate = 0; const target = targetWinRate(level);
  for (let extra = 0; extra <= 3; extra++) {
    let found = 0;
    for (let a = 0; a < 200 && found < CANDIDATES; a++) {
      last = build(level, { ...d, buffer: d.buffer + extra }, rng(seed + a * 104729 + extra * 31));
      if (!canSolve(last)) continue;
      found++;
      const rate = casualWinRate(last, seed), gap = Math.abs(rate - target);
      if (gap < bestGap) { bestGap = gap; best = last; bestRate = rate; }
    }
    if (best && (bestRate >= target - TOO_HARD || extra >= MAX_EASING)) break;
  }
  return best || last;
}

// Daily challenge: same hard level for everyone that day (many colors and trucks, small dock), still solver-checked.
function generateChallenge(day) {
  const d = difficulty(12 + (day % 9)); d.trucks = Math.min(d.trucks + 2, 18); d.buffer = 4;
  return generate(0, d, 500009 + day * 7349);
}

class Game {
  constructor(data) {
    if (!data) return;
    this.columns = data.columns.map(c => c.slice());
    this.hidden = (data.hidden || data.columns.map(c => c.map(() => false))).map(h => h.slice());
    this.frozen = (data.frozen || data.columns.map(() => 0)).slice();
    this.buffer = new Array(data.buffer).fill(EMPTY);
    this.bays = new Array(data.bays).fill(null);
    this.queue = data.trucks.slice(); this.next = 0; this.capacity = data.capacity; this.shipped = 0; this.status = "playing";
    const ev = []; for (let b = 0; b < this.bays.length; b++) this.arrive(b, ev);
    this.update();
  }
  clone() { const g = new Game(); Object.assign(g, this, { columns: this.columns.map(c => c.slice()), hidden: this.hidden.map(h => h.slice()), frozen: this.frozen.slice(), buffer: this.buffer.slice(), bays: this.bays.map(t => t && { ...t }) }); return g; }
  top(c) { const col = this.columns[c]; return col.length ? col[col.length - 1] : EMPTY; }
  free() { return this.buffer.filter(x => x === EMPTY).length; }
  bayFor(color) { return this.bays.findIndex(t => t && t.loaded < t.capacity && t.color === color); }
  isHidden(c, r) { return this.hidden[c][r] && r < this.columns[c].length - 1; }
  upcoming(n) { return this.queue.slice(this.next, this.next + n); }
  canTap(c) { if (this.status !== "playing" || this.frozen[c] > 0) return false; const t = this.top(c); if (t === EMPTY) return false; return this.bayFor(t) >= 0 || this.free() > 0; }
  tap(c) {
    const ev = []; if (!this.canTap(c)) return ev;
    const color = this.columns[c].pop(); this.hidden[c].pop();
    this.frozen = this.frozen.map((f, i) => i !== c && f > 0 ? f - 1 : f);
    const b = this.bayFor(color);
    if (b >= 0) { this.bays[b].loaded++; ev.push({ k: "move", from: "col", fi: c, to: "bay", ti: b, color }); }
    else { const s = this.buffer.indexOf(EMPTY); this.buffer[s] = color; ev.push({ k: "move", from: "col", fi: c, to: "buf", ti: s, color }); }
    let changed = true;
    while (changed) { changed = false;
      for (let i = 0; i < this.bays.length; i++) { const t = this.bays[i];
        if (t && t.loaded >= t.capacity) { ev.push({ k: "depart", bay: i }); this.bays[i] = null; this.shipped++; this.arrive(i, ev); changed = true; } } }
    this.update(); return ev;
  }
  arrive(b, ev) {
    if (this.next >= this.queue.length) return;
    const t = { color: this.queue[this.next++], capacity: this.capacity, loaded: 0 }; this.bays[b] = t; ev.push({ k: "arrive", bay: b, color: t.color });
    for (let i = 0; i < this.buffer.length && t.loaded < t.capacity; i++)
      if (this.buffer[i] === t.color) { this.buffer[i] = EMPTY; t.loaded++; ev.push({ k: "move", from: "buf", fi: i, to: "bay", ti: b, color: t.color }); }
  }
  addSlot() { this.buffer.push(EMPTY); if (this.status === "lost") this.status = "playing"; this.update(); }
  update() {
    if (this.status !== "playing") return;
    if (this.bays.every(t => !t) && this.next >= this.queue.length) { this.status = "won"; return; }
    for (let c = 0; c < this.columns.length; c++) if (this.canTap(c)) return;
    this.status = "lost";
  }
}

function pickMove(s) {
  for (let c = 0; c < s.columns.length; c++) { const t = s.top(c); if (!s.frozen[c] && t !== EMPTY && s.bayFor(t) >= 0) return c; }
  const free = s.free(); let best = -1, bestDepth = Infinity;
  for (let c = 0; c < s.columns.length; c++) { if (s.frozen[c]) continue; const col = s.columns[c];
    for (let i = col.length - 1; i >= 0; i--) { if (s.bayFor(col[i]) < 0) continue; const depth = col.length - 1 - i; if (depth <= free && depth < bestDepth) { bestDepth = depth; best = c; } break; } }
  if (best >= 0) return best;
  let bestWait = Infinity;
  for (let c = 0; c < s.columns.length; c++) { const t = s.top(c); if (t === EMPTY || free === 0 || s.frozen[c]) continue;
    let w = s.queue.indexOf(t, s.next); if (w < 0) w = Infinity - 1; if (w < bestWait) { bestWait = w; best = c; } }
  return best;
}
function canSolve(data) { const s = new Game(data); let guard = 2000;
  while (s.status === "playing" && guard-- > 0) { const m = pickMove(s); if (m < 0 || !s.canTap(m)) return false; s.tap(m); }
  return s.status === "won"; }

// ===== Saved progress =====
const memory = {}; // used when the browser blocks storage
const store = {
  get(k, d) { try { const v = localStorage.getItem("cargo-" + k); return v === null ? d : JSON.parse(v); } catch { return k in memory ? memory[k] : d; } },
  set(k, v) { memory[k] = v; try { localStorage.setItem("cargo-" + k, JSON.stringify(v)); } catch {} }
};

// ===== View =====
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), boardEl = document.getElementById("board");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const W = 10.4, H = 15.6; // world box the board is designed for
const NEXTY = 3.9, CRATE = 0.86, COLSP = 1.25, ROWSP = 0.95, BASEY = -6.6, BUFY = 2.6, BAYY = 5.6, BAYSP = 4.7, SLOTSP = 0.95;
let scale = 40, cx = 0, cy = 0, dpr = 1;

function resize() {
  const r = boardEl.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = Math.min(r.width / W, r.height / H) * dpr; cx = cv.width / 2; cy = cv.height / 2 + 0.2 * scale;
}
const sx = x => cx + x * scale, sy = y => cy - y * scale;

let game, history, view, level, freeUndos, bonus, busy = false, anim = [], hintCol = -1, flying = [];

function colPos(c, r) { return [(c - (view.columns.length - 1) / 2) * COLSP, BASEY + r * ROWSP]; }
function bufSp() { return Math.min(1.15, 9.4 / Math.max(1, view.buffer.length)); }
function bufPos(i) { return [(i - (view.buffer.length - 1) / 2) * bufSp(), BUFY]; }
function bayPos(b) { return [(b - (view.bays.length - 1) / 2) * BAYSP, BAYY]; }
function slotLocal(i, cap) { return [(i - (cap - 1) / 2) * SLOTSP - 0.45, 0.12]; }

function rr(x, y, w, h, r, fill) { // world-space rounded rect centered at x,y
  const X = sx(x - w / 2), Y = sy(y + h / 2), Wp = w * scale, Hp = h * scale, R = Math.min(r * scale, Wp / 2, Hp / 2);
  ctx.beginPath(); ctx.roundRect(X, Y, Wp, Hp, R); ctx.fillStyle = fill; ctx.fill();
}
function dot(x, y, d, fill) { ctx.beginPath(); ctx.arc(sx(x), sy(y), d / 2 * scale, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

const THEMES = [
  { key: "theme_night", price: 0, bg: "#273a55", ground: "#324868", slot: "#1c2b40", bed: "#4a5566" },
  { key: "theme_sunny", price: 300, bg: "#3fa7d6", ground: "#2e86b0", slot: "#1f5f80", bed: "#556070" },

let lang = store.get("lang", "fa");
const fa = () => lang === "fa";
const num = n => fa() ? Number(n).toLocaleString("fa-IR", { useGrouping: false }) : String(n);
function t(key, ...args) { const pair = STR[key]; if (!pair) return key; return pair[fa() ? 1 : 0].replace(/\{(\d)\}/g, (_, i) => num(args[+i])); }
function theme() { return THEMES[Math.min(store.get("theme", 0), THEMES.length - 1)]; }
const owns = i => i === 0 || store.get("owned" + i, false);
let coins = store.get("coins", 0), pendingWin = 0, pendingDaily = 0;
function addCoins(n) { sfx.coins(); flyCoins(n); coins += n; store.set("coins", coins); refresh(); renderShop(); }
function applyLanguage() {
  document.documentElement.lang = lang; document.documentElement.dir = fa() ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("freeCoinsLabel").textContent = t("free_coins", 50);

}
function renderShop() {
  $("shopCoins").textContent = t("coins", coins);
  $("soundBtn").textContent = t(soundOn() ? "sound_on" : "sound_off");
  $("vibeBtn").textContent = t(vibeOn() ? "vibration_on" : "vibration_off");
  const box = $("themes"); box.textContent = "";
  THEMES.forEach((th, i) => {
    const row = document.createElement("div"); row.className = "theme";
    const sw = document.createElement("div"); sw.className = "swatch"; sw.style.background = th.bg;
    const g = document.createElement("i"); g.style.background = th.ground; sw.appendChild(g);
    const name = document.createElement("b"); name.textContent = t(th.key);
    const btn = document.createElement("button"); btn.className = "small";
    const selected = store.get("theme", 0) === i;
    if (selected) { btn.textContent = t("selected"); btn.classList.add("quiet"); }
    else if (owns(i)) btn.textContent = t("use");
    else { btn.textContent = t("coins", th.price); if (coins < th.price) btn.classList.add("quiet"); else btn.classList.add("ad"); }
    btn.onclick = () => {
      if (selected) return;
      if (!owns(i)) { if (coins < th.price) return toast(t("not_enough")); coins -= th.price; store.set("coins", coins); store.set("owned" + i, true); }
      store.set("theme", i); document.body.style.background = theme().bg; refresh(); renderShop();
    };
    row.append(sw, name, btn); box.appendChild(row);

// ===== Port building (same as Assets/Scripts/Game/Port.cs) =====
const PORT_ITEMS = ["pi_pier", "pi_warehouse", "pi_crane", "pi_truck", "pi_lighthouse", "pi_ship"], PORT_BASE = [60, 90, 120, 150, 190, 240];
const SKIES = ["#8fd3f4", "#ffc88a", "#a8e6cf", "#c7b8f2", "#f7a8b8", "#2c3e6b"], WATERS = ["#2e86c8", "#3b8e9e", "#1f9e9a", "#4a6fc9", "#3a7bb8", "#164a7a"];
const portIndex = () => store.get("portIndex", 0), portMask = () => store.get("portBuilt", 0);
const isBuilt = i => (portMask() & (1 << i)) !== 0, builtCount = () => PORT_ITEMS.filter((_, i) => isBuilt(i)).length;
const portCost = i => Math.round(PORT_BASE[i] * (1 + 0.5 * portIndex()) / 10) * 10, portReward = () => 100 + 50 * portIndex();
function portName() { const i = portIndex(); return i < 6 ? t("port_" + (i + 1)) : t("port_6") + " " + num(i - 4); }
function canBuild() { return PORT_ITEMS.some((_, i) => !isBuilt(i) && coins >= portCost(i)); }
const GHOST = "rgba(255,255,255,.22)";
const PORT_PARTS = [ // [x, y, w, h, color, shape] relative to the piece's base point; y up
  { at: [190, -95], parts: [[-60, -35, 12, 60, "#5e3b1a"], [0, -35, 12, 60, "#5e3b1a"], [60, -35, 12, 60, "#5e3b1a"], [0, 0, 170, 18, "#8b5a2b", "r"]] },
  { at: [-300, -90], parts: [[0, 65, 200, 130, "#b5533c"], [0, 140, 224, 26, "#6b2e22", "r"], [0, 35, 72, 70, "#4a2a20"], [-65, 90, 34, 26, "#cfeaff"], [65, 90, 34, 26, "#cfeaff"]] },
  { at: [60, -90], parts: [[0, 130, 26, 260, "#ffc23a"], [110, 250, 260, 20, "#ffc23a"], [-30, 238, 40, 36, "#555"], [200, 175, 4, 130, "#333"], [200, 92, 46, 46, "#e74c3c", "r"]] },
  { at: [-170, -200], parts: [[-30, 30, 120, 55, "#3498db", "r"], [55, 22, 46, 42, "#f1c40f", "r"], [62, 30, 22, 16, "#cfeaff"], [-60, -5, 26, 26, "#15181e", "c"], [-10, -5, 26, 26, "#15181e", "c"], [55, -5, 26, 26, "#15181e", "c"]] },
  { at: [-120, -90], parts: [[0, 115, 46, 230, "#f5f5f5"], [0, 60, 46, 26, "#e74c3c"], [0, 150, 46, 26, "#e74c3c"], [0, 243, 56, 30, "#333"], [0, 243, 26, 26, "#ffe066", "c"], [0, 266, 66, 16, "#e74c3c", "r"]] },
  { at: [350, -170], parts: [[-55, 45, 50, 40, "#f5f5f5"], [10, 42, 40, 30, "#2ecc71"], [55, 42, 40, 30, "#f39c12"], [32, 72, 40, 30, "#3498db"], [0, 0, 190, 56, "#c0392b", "r"]] },
];
function svgRect(x, y, w, h, fill, shape) {
  if (shape === "c") return `<circle cx="${x}" cy="${-y}" r="${w / 2}" fill="${fill}"/>`;
  return `<rect x="${x - w / 2}" y="${-y - h / 2}" width="${w}" height="${h}" rx="${shape === "r" ? Math.min(10, h / 2) : 0}" fill="${fill}"/>`;
}
function renderPort(popItem = -1) {
  const btn = $("portBtn"), ready = canBuild(); btn.textContent = t(ready ? "port_ready" : "port"); btn.classList.toggle("ready", ready);
  if ($("port").hidden) return;
  $("portTitle").textContent = portName(); $("portProgress").textContent = t("port_progress", builtCount(), 6); $("portCoins").textContent = t("coins", coins);
  const k = portIndex() % SKIES.length;
  let svg = `<rect x="-440" y="-260" width="880" height="520" fill="${SKIES[k]}"/><circle cx="300" cy="-170" r="40" fill="#fff3b0"/>` +
    svgRect(0, -200, 880, 120, WATERS[k]) + svgRect(-155, -175, 570, 170, "#c9b27c") + svgRect(-155, -95, 570, 12, "#9c8658");
  PORT_PARTS.forEach((p, i) => {
    const built = isBuilt(i);
    svg += `<g${i === popItem ? ' class="pop"' : ""}>` + p.parts.map(([x, y, w, h, c, sh]) => svgRect(p.at[0] + x, p.at[1] + y, w, h, built ? c : GHOST, sh)).join("") + "</g>";
  });
  $("scene").innerHTML = svg;
  const box = $("pieces"); box.textContent = "";
  PORT_ITEMS.forEach((key, i) => {
    const row = document.createElement("div"); row.className = "piece";
    const name = document.createElement("b"); name.textContent = t(key);
    const b = document.createElement("button"); b.className = "small";
    if (isBuilt(i)) { b.textContent = t("built"); b.classList.add("quiet"); }
    else { b.textContent = t("coins", portCost(i)); b.classList.add(coins >= portCost(i) ? "ad" : "quiet"); }
    b.onclick = () => buildPiece(i);
    row.append(name, b); box.appendChild(row);
  });
}
let portBusy = false;
function buildPiece(i) {
  if (portBusy || isBuilt(i)) return;
  if (!spend(portCost(i))) return toast(t("not_enough"));
  store.set("portBuilt", portMask() | (1 << i)); sfx.horn(); buzz(25); renderPort(i);
  if (builtCount() < 6) return;
  portBusy = true; const reward = portReward();
  setTimeout(() => { sfx.win(); toast(t("port_done", reward), 2200); }, 700);
  setTimeout(() => { store.set("portBuilt", 0); store.set("portIndex", portIndex() + 1); addCoins(reward); toast(t("port_next", portName()), 2000); portBusy = false; renderPort(); }, 2900);
}
$("portBtn").onclick = () => { if (busy) return; $("port").hidden = false; renderPort(); };
$("closePort").onclick = () => $("port").hidden = true;

function today() { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2000, 0, 1)) / 86400000); }
function checkDaily() {
  const last = store.get("dailyDay", 0); if (last === today()) return;
  const streak = last === today() - 1 ? Math.min(store.get("streak", 0) + 1, 7) : 1;
  store.set("streak", streak); pendingDaily = 20 * streak;
  $("dailyTitle").textContent = t("daily_title", streak); $("dailyReward").textContent = t("reward", pendingDaily); $("daily").hidden = false;
}
function finishDaily(n) { store.set("dailyDay", today()); pendingDaily = 0; $("daily").hidden = true; addCoins(n); }

// ===== Game flow =====
function toast(msg, ms = 1600) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, ms); }
function refresh() {
  const hard = level > 0 && isHard(level);
  $("level").textContent = level > 0 ? t(hard ? "hard_level" : "level", level) : t("challenge_level");
  $("level").style.color = hard ? "#ff6b5e" : ""; $("level").style.fontSize = hard ? "22px" : "";
  $("challengeBtn").textContent = t(level > 0 ? "challenge" : "levels"); $("trucks").textContent = t("trucks", game.shipped, game.queue.length);
  // Boosters: free first, then coins if there are enough, otherwise a rewarded ad.
  $("undoSub").textContent = freeUndos > 0 ? t("free", freeUndos) : coins >= PRICE.undo ? t("coins_price", PRICE.undo) : t("watch_ad");
  $("undo").classList.toggle("ad", freeUndos === 0 && coins < PRICE.undo);
  for (const k of ["slot", "hint"]) { $(k + "Sub").textContent = coins >= PRICE[k] ? t("coins_price", PRICE[k]) : t("watch_ad"); $(k).classList.toggle("ad", coins < PRICE[k]); }
  $("noads").hidden = store.get("noads", false);
  $("coins").textContent = t("coins", coins);
  renderPort();
}
function start(n) {
  level = n; game = new Game(n > 0 ? generate(n) : generateChallenge(today())); history = []; freeUndos = 1; bonus = 0; hintCol = -1; busy = false; flying = [];
  view = cloneView(game); $("win").hidden = true; $("lose").hidden = true; pendingWin = 0; refresh();
  // Intro: trucks drive in, crates pop up.
  view.bays.forEach(tr => tr && (tr.off = -9)); introK = 0; busy = true;
  tween(0.45, k => { introK = k; view.bays.forEach(tr => tr && (tr.off = -9 + 9 * k)); }).then(() => { introK = 1; busy = false; });
  tutorialStep();
  if (n === FROZEN_FROM) toast(t("twist_frozen"), 3000); else if (n === HIDDEN_FROM) toast(t("twist_hidden"), 3000); else if (n > 0 && isHard(n)) toast(t("hard_start"));
}
function afterMove() {
  refresh(); tutorialStep();
  if (game.status === "won") {
    sfx.win(); burstConfetti(); if (level === 1) store.set("tutDone", true); tutorialStep();
    if (level === 0) { store.set("challengeDay", today()); pendingWin = CHALLENGE_REWARD; }
    else { store.set("level", level + 1); pendingWin = (10 + Math.floor(level / 2)) * (isHard(level) ? 2 : 1); }
    $("winTitle").textContent = level > 0 ? t("win_title", level) : t("challenge_win"); $("winReward").textContent = t("reward", pendingWin);
    busy = true; setTimeout(() => { busy = false; $("win").hidden = false; }, 800);
  }
  else if (game.status === "lost") { sfx.lose(); $("lose").hidden = false; }
}
function fakeAd(label, done) {
  $("adText").firstChild.textContent = label; $("adText").lastChild.textContent = t("test_ad"); $("ad").hidden = false;
  setTimeout(() => { $("ad").hidden = true; done(); }, 1000);
}
function rewarded(done) { if (busy) return; fakeAd(t("rewarded_ad"), done); }

cv.addEventListener("pointerdown", ev => {
  if (busy || game.status !== "playing") return;
  const r = cv.getBoundingClientRect(); const px = (ev.clientX - r.left) * dpr, py = (ev.clientY - r.top) * dpr;
  const wx = (px - cx) / scale, wy = (cy - py) / scale;
  if (wy < BASEY - 0.8 || wy > BUFY - 0.7) return;
  let c = -1; for (let i = 0; i < view.columns.length; i++) if (Math.abs(wx - colPos(i, 0)[0]) <= COLSP / 2) c = i;
  if (c < 0) return;
  if (!game.canTap(c)) { sfx.invalid(); if (game.frozen[c] > 0) toast(t("frozen")); if (game.columns[c].length) { view.shake = { c, t: 0 }; tween(0.25, k => view.shake && (view.shake.t = k * 0.25)).then(() => view.shake = null); } return; }
  const frozenBefore = game.frozen.filter(f => f > 0).length, hiddenBefore = game.columns.map((_, i) => game.columns[i].length > 1 && game.hidden[i][game.columns[i].length - 2]);
  history.push(game.clone()); const events = game.tap(c);
  if (game.frozen.filter(f => f > 0).length < frozenBefore) setTimeout(() => { sfx.thud(); sfx.pop(3); buzz(20); }, 150);
  if (hiddenBefore[c]) setTimeout(() => sfx.pop(5), 120);
  play(events);
});

function undo() {
  if (busy || !history.length || game.status === "won") return;
  const size = game.buffer.length; game = history.pop(); while (game.buffer.length < size) game.addSlot();
  view = cloneView(game); $("lose").hidden = true; hintCol = -1; refresh(); tutorialStep();
}
const PRICE = { undo: 30, slot: 60, hint: 20 };
function spend(price) { if (coins < price) return false; coins -= price; store.set("coins", coins); sfx.coins(); refresh(); return true; }
$("undo").onclick = () => { if (busy || !history.length) return; if (freeUndos > 0) { freeUndos--; undo(); } else if (spend(PRICE.undo)) undo(); else rewarded(undo); };
$("loseUndo").onclick = () => { if (freeUndos > 0) { freeUndos--; undo(); } else rewarded(undo); };
function addSlot() { bonus++; game.addSlot(); view = cloneView(game); refresh(); }
$("slot").onclick = () => { if (bonus >= 2) return toast(t("dock_max")); if (spend(PRICE.slot)) addSlot(); else rewarded(addSlot); };
$("revive").onclick = () => rewarded(() => { addSlot(); $("lose").hidden = true; });
$("hint").onclick = () => { if (busy) return; const show = () => { hintCol = pickMove(game.clone()); }; if (spend(PRICE.hint)) show(); else rewarded(show); };
$("retry").onclick = () => start(level);
$("reset").onclick = () => { if (!busy) start(level); };
function finishWin(n, allowAd) {
  addCoins(n); pendingWin = 0; $("win").hidden = true;
  if (canBuild() && !store.get("portTip", false)) { store.set("portTip", true); setTimeout(() => toast(t("port_tip"), 2400), 600); }

$("claim").onclick = () => { if (pendingWin) finishWin(pendingWin, true); };
$("claim3").onclick = () => { if (pendingWin) rewarded(() => finishWin(pendingWin * 3, false)); };
$("claimDaily").onclick = () => { if (pendingDaily) finishDaily(pendingDaily); };

const CHALLENGE_REWARD = 100;
$("challengeBtn").onclick = () => {
  if (busy) return;
  if (level === 0) return start(Math.max(1, store.get("level", 1)));

  start(0); toast(t("challenge_start", CHALLENGE_REWARD));

$("soundBtn").onclick = () => { store.set("sound", !soundOn()); renderShop(); };
$("vibeBtn").onclick = () => { store.set("vibe", !vibeOn()); buzz(40); renderShop(); };
$("closeShop").onclick = () => $("shop").hidden = true;
$("freeCoins").onclick = () => rewarded(() => addCoins(50));
$("noads").onclick = () => { store.set("noads", true); refresh(); toast(t("ads_removed")); };
$("lang").onclick = () => {
  lang = fa() ? "en" : "fa"; store.set("lang", lang); applyLanguage(); tutorialStep();
  if (pendingDaily) { $("dailyTitle").textContent = t("daily_title", store.get("streak", 1)); $("dailyReward").textContent = t("reward", pendingDaily); }
};

new ResizeObserver(resize).observe(boardEl); resize();
document.body.style.background = theme().bg;
start(Math.max(1, store.get("level", 1)));
