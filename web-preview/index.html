<title>Cargo Sort</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen phone game; HUD top, canvas board fills the middle, booster bar bottom. Single dark "night dock" look. */
:root {
  --bg: #1f3048;
  --ground: #2b4263;
  --slot: #172538;
  --ink: #f4f7fb;
  --muted: #9fb3cc;
  --btn: #ffb72b;
  --btn-ad: #5bd16a;
  --btn-ink: #1b1b1b;
  --panel: #13202f;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.app {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; gap: 8px;
}
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.title { text-align: center; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: .5px; line-height: 1; }
.title p { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .4px; }
.top .right { justify-self: end; }
.board { flex: 1; min-height: 0; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
button {
  font-family: var(--body); font-weight: 800; font-size: 15px; border: 0; border-radius: 14px;
  padding: 12px 10px; background: var(--btn); color: var(--btn-ink); cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.28); transition: transform .08s;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button.ad { background: var(--btn-ad); }
button.small { font-size: 13px; padding: 8px 12px; }
button small { display: block; font-size: 11px; opacity: .7; font-weight: 800; letter-spacing: .5px; }
.overlay {
  position: fixed; inset: 0; background: rgba(5,10,18,.62); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
}
.card { background: var(--panel); border-radius: 22px; padding: 26px 22px; width: min(360px, 100%); box-sizing: border-box; display: grid; gap: 12px; text-align: center; }
.card h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 32px; text-wrap: balance; }
.card p { margin: 0 0 6px; color: var(--muted); }
.fakead { font-family: var(--display); font-size: 26px; text-align: center; color: var(--ink); }
.fakead span { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); margin-top: 6px; }
.toast { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); background: var(--panel); padding: 12px 18px; border-radius: 12px; font-weight: 800; z-index: 6; max-width: calc(100% - 48px); text-align: center; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<div class="app">
  <div class="top">
    <div><button class="small" id="reset">Reset</button></div>
    <div class="title"><h1 id="level">Level 1</h1><p id="trucks">Trucks 0/0</p></div>
    <div class="right"><button class="small" id="noads">No Ads</button></div>
  </div>
  <div class="board" id="board"><canvas id="cv"></canvas></div>
  <div class="bar">
    <button id="undo">Undo<small id="undoSub">1 FREE</small></button>
    <button class="ad" id="slot">+1 Slot<small>WATCH AD</small></button>
    <button class="ad" id="hint">Hint<small>WATCH AD</small></button>
  </div>
</div>

<div class="overlay" id="win" hidden><div class="card"><h2 id="winTitle">Level complete!</h2><p>Every truck is loaded.</p><button id="next">Next level</button></div></div>
<div class="overlay" id="lose" hidden><div class="card"><h2>Dock is full!</h2><p>No crate can move.</p><button class="ad" id="revive">+1 Slot &amp; Continue<small>WATCH AD</small></button><button id="loseUndo">Undo last move</button><button id="retry">Retry</button></div></div>
<div class="overlay" id="ad" hidden><div class="fakead" id="adText">Ad<span>test ad, 1 second</span></div></div>
<div class="toast" id="toast" hidden></div>

<script>
// ===== Core rules (same as Assets/Scripts/Core in the Unity project) =====
const EMPTY = -1;
const COLORS = ["#f04e4e","#3e8ef7","#4cc95b","#ffcc33","#a85cf0","#ff8a2b","#2fd6d6","#ff6fb5"];

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

function difficulty(level) {
  const d = { bays: 2, capacity: 3, maxHeight: 8 };
  if (level <= 1) return { ...d, colors: 2, trucks: 4, columns: 3, buffer: 5 };
  if (level === 2) return { ...d, colors: 3, trucks: 6, columns: 4, buffer: 5 };
  d.colors = Math.min(3 + Math.floor((level - 1) / 3), 8);
  d.trucks = Math.min(d.colors * 2 + Math.floor((level - 1) / 2), 16);
  d.columns = Math.max(4, Math.min(d.colors, 7));
  d.buffer = level < 15 ? 5 : 4;
  if (level % 5 === 0) d.buffer -= 1;
  return d;
}

function build(level, d, r) {
  const data = { level, capacity: d.capacity, buffer: d.buffer, bays: d.bays, columns: [], trucks: [] };
  for (let i = 0; i < d.trucks; i++) data.trucks.push(i % d.colors);
  shuffle(data.trucks, r);
  const crates = [];
  for (const c of data.trucks) for (let k = 0; k < d.capacity; k++) crates.push(c);
  shuffle(crates, r);
  const cols = Math.max(d.columns, Math.ceil(crates.length / d.maxHeight));
  for (let c = 0; c < cols; c++) data.columns.push([]);
  let i = 0;
  while (i < crates.length) {
    const c = Math.floor(r() * cols);
    const min = Math.min(...data.columns.map(x => x.length));
    if (data.columns[c].length > min + 1 || data.columns[c].length >= d.maxHeight) continue;
    data.columns[c].push(crates[i++]);
  }
  return data;
}

function generate(level) {
  const d = difficulty(level); let last = null;
  for (let extra = 0; extra <= 3; extra++)
    for (let a = 0; a < 200; a++) {
      last = build(level, { ...d, buffer: d.buffer + extra }, rng(level * 7919 + a * 104729 + extra * 31));
      if (canSolve(last)) return last;
    }
  return last;
}

class Game {
  constructor(data) {
    if (!data) return;
    this.columns = data.columns.map(c => c.slice());
    this.buffer = new Array(data.buffer).fill(EMPTY);
    this.bays = new Array(data.bays).fill(null);
    this.queue = data.trucks.slice(); this.next = 0; this.capacity = data.capacity; this.shipped = 0; this.status = "playing";
    const ev = []; for (let b = 0; b < this.bays.length; b++) this.arrive(b, ev);
    this.update();
  }
  clone() { const g = new Game(); Object.assign(g, this, { columns: this.columns.map(c => c.slice()), buffer: this.buffer.slice(), bays: this.bays.map(t => t && { ...t }) }); return g; }
  top(c) { const col = this.columns[c]; return col.length ? col[col.length - 1] : EMPTY; }
  free() { return this.buffer.filter(x => x === EMPTY).length; }
  bayFor(color) { return this.bays.findIndex(t => t && t.loaded < t.capacity && t.color === color); }
  canTap(c) { if (this.status !== "playing") return false; const t = this.top(c); if (t === EMPTY) return false; return this.bayFor(t) >= 0 || this.free() > 0; }
  tap(c) {
    const ev = []; if (!this.canTap(c)) return ev;
    const color = this.columns[c].pop(); const b = this.bayFor(color);
    if (b >= 0) { this.bays[b].loaded++; ev.push({ k: "move", from: "col", fi: c, to: "bay", ti: b, color }); }
    else { const s = this.buffer.indexOf(EMPTY); this.buffer[s] = color; ev.push({ k: "move", from: "col", fi: c, to: "buf", ti: s, color }); }
    let changed = true;
    while (changed) { changed = false;
      for (let i = 0; i < this.bays.length; i++) { const t = this.bays[i];
        if (t && t.loaded >= t.capacity) { ev.push({ k: "depart", bay: i }); this.bays[i] = null; this.shipped++; this.arrive(i, ev); changed = true; } } }
    this.update(); return ev;
  }
  arrive(b, ev) {
    if (this.next >= this.queue.length) return;
    const t = { color: this.queue[this.next++], capacity: this.capacity, loaded: 0 }; this.bays[b] = t; ev.push({ k: "arrive", bay: b, color: t.color });
    for (let i = 0; i < this.buffer.length && t.loaded < t.capacity; i++)
      if (this.buffer[i] === t.color) { this.buffer[i] = EMPTY; t.loaded++; ev.push({ k: "move", from: "buf", fi: i, to: "bay", ti: b, color: t.color }); }
  }
  addSlot() { this.buffer.push(EMPTY); if (this.status === "lost") this.status = "playing"; this.update(); }
  update() {
    if (this.status !== "playing") return;
    if (this.bays.every(t => !t) && this.next >= this.queue.length) { this.status = "won"; return; }
    for (let c = 0; c < this.columns.length; c++) if (this.canTap(c)) return;
    this.status = "lost";
  }
}

function pickMove(s) {
  for (let c = 0; c < s.columns.length; c++) { const t = s.top(c); if (t !== EMPTY && s.bayFor(t) >= 0) return c; }
  const free = s.free(); let best = -1, bestDepth = Infinity;
  for (let c = 0; c < s.columns.length; c++) { const col = s.columns[c];
    for (let i = col.length - 1; i >= 0; i--) { if (s.bayFor(col[i]) < 0) continue; const depth = col.length - 1 - i; if (depth <= free && depth < bestDepth) { bestDepth = depth; best = c; } break; } }
  if (best >= 0) return best;
  let bestWait = Infinity;
  for (let c = 0; c < s.columns.length; c++) { const t = s.top(c); if (t === EMPTY || free === 0) continue;
    let w = s.queue.indexOf(t, s.next); if (w < 0) w = Infinity - 1; if (w < bestWait) { bestWait = w; best = c; } }
  return best;
}
function canSolve(data) { const s = new Game(data); let guard = 2000;
  while (s.status === "playing" && guard-- > 0) { const m = pickMove(s); if (m < 0 || !s.canTap(m)) return false; s.tap(m); }
  return s.status === "won"; }

// ===== Saved progress =====
const store = {
  get(k, d) { try { const v = localStorage.getItem("cargo-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("cargo-" + k, JSON.stringify(v)); } catch {} }
};

// ===== View =====
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), boardEl = document.getElementById("board");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const W = 10.4, H = 15.6; // world box the board is designed for
const CRATE = 0.86, COLSP = 1.25, ROWSP = 0.95, BASEY = -6.6, BUFY = 2.6, BAYY = 5.6, BAYSP = 4.7, SLOTSP = 0.95;
let scale = 40, cx = 0, cy = 0, dpr = 1;

function resize() {
  const r = boardEl.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  scale = Math.min(r.width / W, r.height / H) * dpr; cx = cv.width / 2; cy = cv.height / 2 + 0.2 * scale;
}
const sx = x => cx + x * scale, sy = y => cy - y * scale;

let game, history, view, level, freeUndos, bonus, busy = false, anim = [], hintCol = -1, flying = [];

function colPos(c, r) { return [(c - (view.columns.length - 1) / 2) * COLSP, BASEY + r * ROWSP]; }
function bufSp() { return Math.min(1.15, 9.4 / Math.max(1, view.buffer.length)); }
function bufPos(i) { return [(i - (view.buffer.length - 1) / 2) * bufSp(), BUFY]; }
function bayPos(b) { return [(b - (view.bays.length - 1) / 2) * BAYSP, BAYY]; }
function slotLocal(i, cap) { return [(i - (cap - 1) / 2) * SLOTSP - 0.45, 0.12]; }

function rr(x, y, w, h, r, fill) { // world-space rounded rect centered at x,y
  const X = sx(x - w / 2), Y = sy(y + h / 2), Wp = w * scale, Hp = h * scale, R = Math.min(r * scale, Wp / 2, Hp / 2);
  ctx.beginPath(); ctx.roundRect(X, Y, Wp, Hp, R); ctx.fillStyle = fill; ctx.fill();
}
function dot(x, y, d, fill) { ctx.beginPath(); ctx.arc(sx(x), sy(y), d / 2 * scale, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(v * (1 - k)); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function crate(x, y, color, s = 1) {
  const c = COLORS[color], z = CRATE * s;
  rr(x, y, z, z, 0.16 * s, shade(c, 0.45)); rr(x, y, z * 0.86, z * 0.86, 0.12 * s, c); rr(x, y, z * 0.86, z * 0.16, 0.02, shade(c, 0.2));
}
function truck(x, y, color, loaded, cap) {
  const c = COLORS[color], bedW = cap * SLOTSP + 0.2, bedL = slotLocal(0, cap)[0] - SLOTSP / 2 - 0.1, bedC = bedL + bedW / 2, cabX = bedL + bedW + 0.5;
  rr(x + bedC, y + 0.05, bedW, 1.15, 0.18, "#4a5566"); rr(x + bedC, y - 0.48, bedW, 0.2, 0.05, c);
  for (let i = 0; i < cap; i++) { const [lx, ly] = slotLocal(i, cap); rr(x + lx, y + ly, CRATE, CRATE, 0.14, "#38404d"); }
  rr(x + cabX, y - 0.05, 0.9, 1.0, 0.2, c); rr(x + cabX + 0.12, y + 0.15, 0.5, 0.5, 0.1, "#cfeaff");
  for (const wx of [bedL + 0.55, bedL + bedW - 0.4, cabX + 0.05]) dot(x + wx, y - 0.62, 0.5, "#15181e");
  for (let i = 0; i < loaded; i++) { const [lx, ly] = slotLocal(i, cap); crate(x + lx, y + ly, color, 0.95); }
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!view) return;
  // trucks
  view.bays.forEach((t, b) => { const [x, y] = bayPos(b); rr(x, y - 0.95, BAYSP - 0.4, 0.18, 0.05, "#172538"); if (t) truck(x + (t.off || 0), y, t.color, t.loaded, t.capacity); });
  // dock
  rr(0, BUFY, view.buffer.length * bufSp() + 0.3, 1.25, 0.25, "#2b4263");
  view.buffer.forEach((c, i) => { const [x, y] = bufPos(i); rr(x, y, CRATE + 0.08, CRATE + 0.08, 0.16, "#172538"); if (c !== EMPTY) crate(x, y, c); });
  // lanes and stacks
  const tallest = Math.max(1, ...view.columns.map(c => c.length));
  view.columns.forEach((col, c) => {
    const [x] = colPos(c, 0), h = tallest * ROWSP + 0.25;
    rr(x, BASEY - 0.55 + h / 2, COLSP - 0.15, h, 0.22, "#2b4263");
    col.forEach((color, r) => { const [px, py] = colPos(c, r); const shake = view.shake && view.shake.c === c && r === col.length - 1 ? Math.sin(view.shake.t * 40) * 0.12 * (1 - view.shake.t / 0.25) : 0; crate(px + shake, py, color); });
  });
  if (hintCol >= 0 && hintCol < view.columns.length) { const [hx, hy] = colPos(hintCol, view.columns[hintCol].length); const b = Math.abs(Math.sin(performance.now() / 160)) * 0.3; dot(hx, hy + 0.1 + b, 0.42, "#ffffff"); }
  for (const f of flying) crate(f.x, f.y, f.color);
}

function cloneView(g) { return { columns: g.columns.map(c => c.slice()), buffer: g.buffer.slice(), bays: g.bays.map(t => t && { ...t, off: 0 }) }; }

function tween(time, step) { return new Promise(res => { if (reduce) { step(1); return res(); } const t0 = performance.now();
  (function f(now) { const k = Math.min(1, (now - t0) / (time * 1000)); step(1 - (1 - k) * (1 - k)); if (k < 1) requestAnimationFrame(f); else res(); })(t0); }); }

async function play(events) {
  busy = true; hintCol = -1;
  for (const e of events) {
    if (e.k === "move") {
      let from; if (e.from === "col") { const col = view.columns[e.fi]; from = colPos(e.fi, col.length - 1); col.pop(); } else { from = bufPos(e.fi); view.buffer[e.fi] = EMPTY; }
      let to; if (e.to === "bay") { const t = view.bays[e.ti]; const [bx, by] = bayPos(e.ti); const [lx, ly] = slotLocal(t.loaded, t.capacity); to = [bx + lx, by + ly]; } else to = bufPos(e.ti);
      const f = { x: from[0], y: from[1], color: e.color }; flying.push(f);
      const arc = 0.6 + Math.hypot(to[0] - from[0], to[1] - from[1]) * 0.06;
      await tween(0.16, k => { f.x = from[0] + (to[0] - from[0]) * k; f.y = from[1] + (to[1] - from[1]) * k + Math.sin(k * Math.PI) * arc; });
      flying = flying.filter(x => x !== f);
      if (e.to === "bay") view.bays[e.ti].loaded++; else view.buffer[e.ti] = e.color;
    } else if (e.k === "depart") {
      const t = view.bays[e.bay]; await tween(0.24, k => t.off = k * 9); view.bays[e.bay] = null;
    } else if (e.k === "arrive") {
      const t = { color: e.color, capacity: game.capacity, loaded: 0, off: -9 }; view.bays[e.bay] = t; await tween(0.24, k => t.off = -9 + 9 * k);
    }
  }
  view = cloneView(game); busy = false; afterMove();
}

function loop() { draw(); requestAnimationFrame(loop); }

// ===== Game flow =====
const $ = id => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1600); }
function refresh() {
  $("level").textContent = "Level " + level; $("trucks").textContent = `Trucks ${game.shipped}/${game.queue.length}`;
  $("undoSub").textContent = freeUndos > 0 ? freeUndos + " FREE" : "WATCH AD";
  $("undo").classList.toggle("ad", freeUndos === 0);
  $("noads").hidden = store.get("noads", false);
}
function start(n) {
  level = n; game = new Game(generate(n)); history = []; freeUndos = 1; bonus = 0; hintCol = -1; busy = false; flying = [];
  view = cloneView(game); $("win").hidden = true; $("lose").hidden = true; refresh();
}
function afterMove() {
  refresh();
  if (game.status === "won") { store.set("level", level + 1); $("winTitle").textContent = `Level ${level} complete!`; $("win").hidden = false; }
  else if (game.status === "lost") $("lose").hidden = false;
}
function fakeAd(label, done) {
  $("adText").firstChild.textContent = label; $("ad").hidden = false;
  setTimeout(() => { $("ad").hidden = true; done(); }, 1000);
}
function rewarded(done) { if (busy) return; fakeAd("Rewarded ad", done); }

cv.addEventListener("pointerdown", ev => {
  if (busy || game.status !== "playing") return;
  const r = cv.getBoundingClientRect(); const px = (ev.clientX - r.left) * dpr, py = (ev.clientY - r.top) * dpr;
  const wx = (px - cx) / scale, wy = (cy - py) / scale;
  if (wy < BASEY - 0.8 || wy > BUFY - 0.7) return;
  let c = -1; for (let i = 0; i < view.columns.length; i++) if (Math.abs(wx - colPos(i, 0)[0]) <= COLSP / 2) c = i;
  if (c < 0) return;
  if (!game.canTap(c)) { if (game.columns[c].length) { view.shake = { c, t: 0 }; tween(0.25, k => view.shake && (view.shake.t = k * 0.25)).then(() => view.shake = null); } return; }
  history.push(game.clone()); play(game.tap(c));
});

function undo() {
  if (busy || !history.length || game.status === "won") return;
  const size = game.buffer.length; game = history.pop(); while (game.buffer.length < size) game.addSlot();
  view = cloneView(game); $("lose").hidden = true; hintCol = -1; refresh();
}
$("undo").onclick = () => { if (busy || !history.length) return; if (freeUndos > 0) { freeUndos--; undo(); } else rewarded(undo); };
$("loseUndo").onclick = () => { if (freeUndos > 0) { freeUndos--; undo(); } else rewarded(undo); };
function addSlot() { bonus++; game.addSlot(); view = cloneView(game); refresh(); }
$("slot").onclick = () => { if (bonus >= 2) return toast("Dock is at max size"); rewarded(addSlot); };
$("revive").onclick = () => fakeAd("Rewarded ad", () => { addSlot(); $("lose").hidden = true; });
$("hint").onclick = () => rewarded(() => { hintCol = pickMove(game.clone()); });
$("retry").onclick = () => start(level);
$("reset").onclick = () => { if (!busy) start(level); };
$("next").onclick = () => { const n = level + 1; $("win").hidden = true;
  if (!store.get("noads", false) && n >= 4 && (n - 4) % 3 === 0) fakeAd("Ad between levels", () => start(n)); else start(n); };
$("noads").onclick = () => { store.set("noads", true); refresh(); toast("Ads removed (test purchase)"); };

new ResizeObserver(resize).observe(boardEl); resize();
start(Math.max(1, store.get("level", 1)));
loop();
</script>
