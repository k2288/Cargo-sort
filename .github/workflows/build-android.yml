name: Build Android APK

# Runs by hand (Actions tab > Build Android APK > Run workflow) or when you push a version tag like v1.0.
# Not on every push, to save GitHub Actions minutes (each store build takes ~20 minutes).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1 # a Unity Personal license can only be active on a limited number of machines at once
      matrix:
        store: [bazaar, myket, googleplay]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the Unity Android image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ matrix.store }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-${{ matrix.store }}-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: CargoSort
          buildMethod: CargoSort.EditorTools.BuildScript.BuildAndroid
          customParameters: -store ${{ matrix.store }}

      - uses: actions/upload-artifact@v4
        with:
          name: CargoSort-${{ matrix.store }}-apk
          path: build/Android
          if-no-files-found: error
