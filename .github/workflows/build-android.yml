name: Build Android APK

# Runs by hand (Actions tab > Build Android APK > Run workflow, then pick the store) or when you push a version tag like v1.0.
# Not on every push, to save GitHub Actions minutes (each store build takes ~20 minutes).
on:
  workflow_dispatch:
    inputs:
      store:
        description: Which store to build for
        type: choice
        default: bazaar
        options: [bazaar, myket, googleplay, all]
      cpu:
        description: "split = two smaller APKs, one per CPU type (upload both in one Bazaar release); both = one APK for every phone; arm64 / armv7 = one CPU type only"
        type: choice
        default: split
        options: [split, both, arm64, armv7]
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1 # a Unity Personal license can only be active on a limited number of machines at once
      matrix:
        # The dropdown picks one store; "all" or a version tag builds all three.
        store: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.store != 'all') && format('["{0}"]', inputs.store) || '["bazaar","myket","googleplay"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the Unity Android image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ matrix.store }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-${{ matrix.store }}-

      - name: Decode and check signing key (prints yes/no only, never the secrets)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KEY_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No keystore secret: debug-signed build"; exit 0; fi
          # Keep only real base64 characters (pasted text can carry a BOM, quotes or line breaks).
          bad=$(printf '%s' "$KS_B64" | tr -d 'A-Za-z0-9+/=' | od -An -tx1 | tr -s ' \n' ' ')
          [ -n "${bad// /}" ] && echo "Ignored non-base64 bytes (hex):$bad"
          clean=$(printf '%s' "$KS_B64" | tr -cd 'A-Za-z0-9+/=')
          # A trailing "=" is easy to miss when copying; add the padding back if it is missing.
          while [ $(( ${#clean} % 4 )) -ne 0 ]; do clean="$clean="; echo "Added missing '=' padding"; done
          printf '%s' "$clean" | base64 -d > release.keystore || echo "Base64 text is damaged"
          echo "Base64 length: ${#clean} (should be a multiple of 4: remainder $(( ${#clean} % 4 )))"
          echo "Padding '=' count: $(printf '%s' "$clean" | tr -cd '=' | wc -c), last 2 chars are padding: $([[ "$clean" == *= ]] && echo yes || echo no)"
          echo "Decoded keystore size: $(stat -c %s release.keystore) bytes"
          if [ ! -s release.keystore ] || ! keytool -list -keystore release.keystore -storepass "$KS_PASS" > /dev/null 2>&1; then
            echo "::error::The keystore secret is damaged or the password is wrong. Paste ANDROID_KEYSTORE_BASE64 again (the whole text) and check ANDROID_KEYSTORE_PASS."
            FAIL=1
          fi
          if keytool -list -keystore release.keystore -storepass "$KS_PASS" > /tmp/list.txt 2>&1; then echo "Keystore password: OK"; else echo "Keystore password or file: WRONG"; grep -i "exception\|error" /tmp/list.txt | grep -v -i pass | head -3; fi
          grep -i "keystore type" /tmp/list.txt || true
          echo "Number of keys: $(grep -c PrivateKeyEntry /tmp/list.txt)"
          if keytool -list -keystore release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then echo "Alias: found"; else echo "Alias: NOT FOUND (the alias secret does not match)"; fi
          if [ "$KEY_PASS" = "$KS_PASS" ]; then echo "Key password equals keystore password: yes"; else echo "Key password equals keystore password: NO"; fi
          if keytool -certreq -keystore release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" > /dev/null 2>&1; then echo "Key password: OK"; else echo "Key password: WRONG"; fi
          rm -f /tmp/list.txt
          if [ "$FAIL" = "1" ]; then exit 1; fi

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: CargoSort
          buildMethod: CargoSort.EditorTools.BuildScript.BuildAndroid
          customParameters: -store ${{ matrix.store }} -abi ${{ inputs.cpu || 'both' }}
          # Release signing (optional). Without these secrets the APK is debug-signed for testing.
          androidKeystoreName: release.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          # Version shown in the store; bump the number for each upload.
          versioning: Custom
          version: 1.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}

      - name: APK size
        shell: bash
        run: |
          for f in $(find build/Android -name '*.apk'); do
            size=$(du -h "$f" | cut -f1); echo "$f: $size"; echo "APK size: **$size** ($(basename "$f"))" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: CargoSort-${{ matrix.store }}-${{ inputs.cpu || 'both' }}-apk
          path: build/Android
          if-no-files-found: error
